name = "minka-coffee-api"
main = "src/index.js"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]


# Own address on rgapp.page; the workers.dev address stays on for apps
# installed before the move.
workers_dev = true
routes = [{ pattern = "coffee.rgapp.page", custom_domain = true }]
[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[[d1_databases]]
binding = "COFFEE_DB"
database_name = "minka-coffee-db"
database_id = "c3a19953-62d0-4aeb-9f2d-0223f83b7152"

# Login check: asks minka-api whether the app's bearer token is valid.
[[services]]
binding = "AUTH"
service = "minka-api"
