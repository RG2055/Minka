name = "minka-api"
main = "src/index.js"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]
account_id = "a678c2143bd64a6ef4b783aac9953e94"


# Own address on rgapp.page; the workers.dev address stays on for apps
# installed before the move.
workers_dev = true
routes = [{ pattern = "api.rgapp.page", custom_domain = true }]
[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[vars]
# Archive copy of every Bolus change (the former Bolus sheet's Apps Script).
BOLUS_SHEET_URL = "https://script.google.com/macros/s/AKfycbxmGL8uDYdOOb4hsegNu_eBQm0CdthdewIdJAQBLIoEIJhc4q-sV_sVQRSeorvmTvDG/exec"

[[d1_databases]]
binding = "DB"
database_name = "minka-db"
database_id = "643ee348-1085-47f1-a2fb-46bc149f94bb"

[[kv_namespaces]]
binding = "MINKA_EMOJI"
id = "72f5893dcfc44771bd2ab40913ae99b4"

# Refreshes the schedule copy from Apps Script (see refreshSchedule in src/index.js).
[triggers]
crons = ["*/2 * * * *", "*/10 * * * *"]
