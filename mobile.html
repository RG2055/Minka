<script>
(function() {
  var API_BASE = 'https://api.rgapp.page';
  var TOKEN_KEY = 'minka_api_token_v1';
  var AUTO_PW_KEY = 'pw';

  function getToken() {
    try { return sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || ''; }
    catch (_e) { return ''; }
  }

  function setToken(token, persist) {
    try {
      sessionStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(TOKEN_KEY);
      if (token) {
        if (persist) localStorage.setItem(TOKEN_KEY, token);
        else sessionStorage.setItem(TOKEN_KEY, token);
      }
    } catch (_e) {}
  }

  var CALENDAR_BUILD = '20260926api1';

  function withCalendarBuild(url) {
    try {
      var u = new URL(url, window.location.href);
      u.searchParams.set('cv', CALENDAR_BUILD);
      if (window.MINKA_APP === 'rad') u.searchParams.set('app', 'rad');
      return u.pathname + u.search + u.hash;
    } catch (_e) {
      var join = url.indexOf('?') >= 0 ? '&' : '?';
      return url + join + 'cv=' + encodeURIComponent(CALENDAR_BUILD) + (window.MINKA_APP === 'rad' ? '&app=rad' : '');
    }
  }

  function notifyIframeAuth() {
    function sendAuth() {
      var f = document.getElementById('calIframe');
      if (!f) return;
      var token = getToken();
      if (!token) return;
      var base = withCalendarBuild(f.getAttribute('data-base-src') || 'kalendars/index.html');
      try { if (new URLSearchParams(window.location.search).get('mv2') === '0') base += '&mv2=0'; } catch (_e) {}
      var next = base;
      var nextAbsolute = new URL(next, window.location.href).href;
      if (f.src !== nextAbsolute) f.setAttribute('src', next);
      if (f.contentWindow) f.contentWindow.postMessage({ type: 'minka_auth_ok', token: token }, window.location.origin);
    }
    var frame = document.getElementById('calIframe');
    if (frame) frame.addEventListener('load', sendAuth, { once: true });
    setTimeout(sendAuth, 0);
    setTimeout(sendAuth, 250);
    setTimeout(sendAuth, 900);
  }

  function stripAutoLoginParam() {
    try {
      var url = new URL(window.location.href);
      if (!url.searchParams.has(AUTO_PW_KEY) && !url.searchParams.has('pair')) return;
      url.searchParams.delete(AUTO_PW_KEY);
      url.searchParams.delete('pair');
      history.replaceState({}, '', url.toString());
    } catch (_e) {}
  }

  async function claimPairCode(code) {
    code = String(code || '').toUpperCase().replace(/[^A-Z2-9]/g, '');
    if (!code) return false;
    try {
      var res = await fetch(API_BASE + '/api/pair/claim', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ code: code })
      });
      var data = await res.json().catch(function() { return {}; });
      if (!res.ok || !data || !data.token) { window.__minkaPairExpired = true; return false; }
      setToken(data.token, true);
      var pairGate = document.getElementById('minka-pair-required');
      if (pairGate) pairGate.remove();
      notifyIframeAuth();
      return true;
    } catch (_e) {
      window.__minkaPairExpired = true;
      return false;
    }
  }

  async function tryPairLoginFromQuery() {
    var code = '';
    try {
      var url = new URL(window.location.href);
      code = String(url.searchParams.get('pair') || '').trim();
      if (code) { url.searchParams.delete('pair'); history.replaceState({}, '', url.toString()); }
    } catch (_e) {}
    return claimPairCode(code);
  }

  // Logging in from a ?pw= query parameter was removed on purpose. The shared
  // password in a URL leaks into server access logs, browser history and the
  // Referer header sent to the third-party font/CDN hosts this page preconnects
  // to — and stripAutoLoginParam() only cleans the address bar afterwards, which
  // is far too late. Phones pair with the one-time ?pair= code instead
  // (claimPairCode above), which expires in two minutes and works only once.
  // stripAutoLoginParam() still deletes a stray pw= so old bookmarks stop
  // carrying the password around in the address bar.

  function showPairRequired() {
    function mount() {
      if (document.getElementById('minka-pair-required')) return;
      document.documentElement.style.visibility = '';
      var overlay = document.createElement('div');
      overlay.id = 'minka-pair-required';
      // Same 1-bit dither look as the desktop login: black ground, grey
      // x-ray pixels fading out round the card, white controls.
      overlay.style.cssText = 'position:fixed;inset:0;z-index:1000000;display:flex;align-items:center;justify-content:center;padding:24px;background:url(data/gate-bg-dither.png?v=20260924d2) center/cover no-repeat #000;image-rendering:pixelated;font-family:Inter,system-ui,sans-serif;color:#fff;text-align:center;';
      overlay.innerHTML = '<div style="width:min(360px,100%);padding:30px 24px;border:1px solid #2e2e2e;border-radius:6px;background:#000">'
        + '<img src="data/rg-loader-ring.gif?v=20260924d1" alt="RG" width="128" height="128" style="display:block;width:112px;height:112px;margin:0 auto 14px;image-rendering:pixelated">'
        + '<h1 style="margin:0;font-size:0"><span id="minka-pair-title" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap">Piekļuve telefonā</span><canvas id="minka-pair-title-dt" width="1" height="1" aria-hidden="true" style="display:block;margin:0 auto;image-rendering:pixelated"></canvas></h1>'
        + '<div style="width:64px;height:4px;margin:12px auto 0;background-image:repeating-conic-gradient(#fff 0 25%,transparent 0 50%);background-size:2px 2px"></div>'
        + '<div style="margin-top:14px;font-size:14px;line-height:1.55;color:#a3a3a3">Ievadi vienreizējo kodu no <b style="color:#fff">MOBILE</b> loga datorā.</div>'
        + '<input id="minka-pair-code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" maxlength="11" placeholder="XXXX XXXX" style="width:100%;height:52px;margin-top:22px;box-sizing:border-box;border:1px solid #4a4a4a;border-radius:4px;background:#000;color:#fff;text-align:center;font:700 18px/1 ui-monospace,monospace;letter-spacing:.15em;outline:none;text-transform:uppercase">'
        + '<button id="minka-pair-submit" type="button" style="width:100%;height:48px;margin-top:12px;border:0;border-radius:4px;background:#fff;color:#000;font:700 14px/1 Inter,system-ui,sans-serif">Savienot</button>'
        + '<div id="minka-pair-error" style="min-height:18px;margin-top:11px;color:#fff;font-size:12px"></div>'
        + '</div>';
      document.body.appendChild(overlay);
      if (window.MinkaDitherText) window.MinkaDitherText.bind(document.getElementById('minka-pair-title-dt'), document.getElementById('minka-pair-title'), { size: 15, weight: 800, family: 'Inter, system-ui, sans-serif', fade: .25 });
      var codeField = document.getElementById('minka-pair-code');
      codeField.addEventListener('focus', function () { codeField.style.borderColor = '#fff'; });
      codeField.addEventListener('blur', function () { codeField.style.borderColor = '#4a4a4a'; });
      var input = document.getElementById('minka-pair-code');
      var submit = document.getElementById('minka-pair-submit');
      var error = document.getElementById('minka-pair-error');
      async function connect() {
        var code = String(input.value || '').toUpperCase().replace(/[^A-Z2-9]/g, '');
        error.textContent = '';
        if (code.length !== 8) { error.textContent = 'Ievadi visus 8 koda simbolus.'; return; }
        submit.disabled = true;
        submit.textContent = 'Savieno…';
        var ok = await claimPairCode(code);
        if (!ok) {
          error.textContent = 'Kods nav derīgs. Datorā izveido jaunu kodu.';
          submit.disabled = false;
          submit.textContent = 'Savienot';
        }
      }
      input.addEventListener('input', function() {
        var clean = input.value.toUpperCase().replace(/[^A-Z2-9]/g, '').slice(0, 8);
        input.value = clean.length > 4 ? clean.slice(0, 4) + ' ' + clean.slice(4) : clean;
      });
      input.addEventListener('keydown', function(e) { if (e.key === 'Enter') connect(); });
      submit.addEventListener('click', connect);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount, { once: true });
    else mount();
  }

  var hasPairCode = false;
  try { hasPairCode = !!new URL(window.location.href).searchParams.get('pair'); } catch (_e) {}

  if (hasPairCode) {
    document.addEventListener('DOMContentLoaded', function() {
      tryPairLoginFromQuery().then(function(paired) {
        if (paired) return;
        setToken('', false);
        showPairRequired();
      });
    }, { once: true });
  } else if (!getToken()) {
    document.addEventListener('DOMContentLoaded', function() {
      stripAutoLoginParam();
      showPairRequired();
    }, { once: true });
  } else {
    stripAutoLoginParam();
    document.addEventListener('DOMContentLoaded', notifyIframeAuth, { once: true });
  }

  window.addEventListener('message', function(event) {
    if (event.origin !== window.location.origin || !event.data || event.data.type !== 'minka_auth_required') return;
    var frame = document.getElementById('calIframe');
    if (!frame || event.source !== frame.contentWindow) return;
    setToken('', false);
    showPairRequired();
  });
})();
</script>
<script>
(function() {
  try {
    var nav = window.navigator || {};
    var mem = Number(nav.deviceMemory || 0);
    var cores = Number(nav.hardwareConcurrency || 0);
    var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var lowSpec = reduceMotion || (mem > 0 && mem <= 8) || (cores > 0 && cores <= 4);
    window.__mkPerfProfile = {
      lowSpec: lowSpec,
      reducedMotion: reduceMotion,
      deviceMemory: mem,
      hardwareConcurrency: cores
    };
    if (lowSpec) document.documentElement.classList.add('mk-low-spec');
  } catch (_e) {
    window.__mkPerfProfile = { lowSpec: false, reducedMotion: false, deviceMemory: 0, hardwareConcurrency: 0 };
  }
})();
</script>

<style>
:root {
  --font: 'Space Grotesk', system-ui, sans-serif;
  --dock-h: 60px;
  --dock-btn-h: clamp(36px, 6.8svh, 42px);
  --dock-icon-size: clamp(16px, 3.2svh, 20px);
  --dock-seg-h: clamp(17px, 3.2svh, 21px);
  --calendar-bottom: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px) + 4px);
  --page-pad: 0px;
  --accent: #00c8ff;
  --accent-2: #38bdf8;
  --ink: #e8f4ff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  overflow: hidden;
  font-family: var(--font);
  color: var(--ink);
  background: #000;
}

body * { font-family: var(--font), inherit; }

#calendarEmbed {
  position: fixed;
  /* Zem iPhone status joslas (viewport-fit=cover): kalendārs sākas zem "notch". */
  top: env(safe-area-inset-top, 0px);
  left: 0;
  right: 0;
  bottom: var(--calendar-bottom);
  z-index: 1;
  overflow: hidden;
  border-radius: 0;
  border: 0;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow: none;
  opacity: 1;
  transition: bottom .32s cubic-bezier(.22,1,.36,1);
}

#calendarEmbed.is-ready {
  opacity: 1;
}

html.mk-low-spec #calendarEmbed {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

#calendarEmbed iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
}

/* Dither loader, same as the desktop one (js/dither-loader.js): a dithered
   clip behind, the RG ring spinning, the status as dithered pixel text. */
#mobileDataLoader {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 24px;
  overflow: hidden;
  background: #000;
  transition: opacity .24s ease, visibility .24s ease;
}
#mobileDataLoader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#mobileDataLoader .mkl-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; image-rendering:pixelated; opacity:.62; }
#mobileDataLoader .mkl-bg:not([src]) { display:none; }
#mobileDataLoader .mkl-scrim { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; image-rendering:pixelated; }
#mobileDataLoader .mkl-scrim:not([src]) { display:none; }
#mobileDataLoader .mkl-ring { position:relative; width:192px; height:192px; image-rendering:pixelated; }
#mobileDataLoader .mkl-text { position:relative; width:2px; height:2px; image-rendering:pixelated; }
#mobileDataLoader .mkl-load-status { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }

.mobile-dock {
  position: fixed;
  left: 6px;
  right: 6px;
  bottom: 6px;
  z-index: 30;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  border-radius: 24px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.03) 30%, rgba(255,255,255,.02) 100%),
    rgba(8,16,28,.58);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,.16);
  box-shadow: 0 16px 40px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(255,255,255,.03);
}

.mobile-dock-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
}

.dock-btn {
  appearance: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  border: 1px solid rgba(255,255,255,.14);
  background:
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 28%, rgba(255,255,255,.02)),
    rgba(10,20,34,.52);
  color: #eef7ff;
  border-radius: 16px;
  min-height: 50px;
  padding: 6px 4px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 16px rgba(0,0,0,.10);
}

.dock-btn:active {
  transform: translateY(1px) scale(.99);
}

.dock-icon {
  width: 24px;
  height: 24px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.09);
  font-size: 12px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
}
/* Pikseļu ikonas (SVG) — bez fona kastes, dabīgas proporcijas, asas */
.dock-icon.dock-px {
  width: 22px !important;
  height: auto !important;
  background: transparent !important;
  box-shadow: none !important;
  border-radius: 0 !important;
  image-rendering: pixelated;
}

.dock-btn.is-active {
  border-color: rgba(0,200,255,.40);
  box-shadow: 0 10px 24px rgba(0,200,255,.12), inset 0 1px 0 rgba(255,255,255,.12);
}

.dock-btn.primary {
  background:
    linear-gradient(180deg, rgba(0,200,255,.18), rgba(79,70,229,.14)),
    rgba(8,18,30,.90);
}

.dock-btn.hidden-install {
  display: none;
}

#bolusDocBtn {
  position: relative;
  overflow: visible;
  gap: 5px;
  padding: 5px 4px 5px 7px;
  flex-direction: row;
  align-items: center;
  justify-content: stretch;
  background:
    linear-gradient(180deg, rgba(20,27,40,.88), rgba(12,18,28,.92)),
    rgba(8,16,28,.68);
}

#bolusDocBtn::after {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 0 99px 99px 0;
  display: none;
}

#bolusDocBtn .bolus-dock-title {
  display: inline-flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
  font-size: 9px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: .10em;
  text-transform: uppercase;
  color: rgba(255,255,255,.96);
  text-shadow: 0 1px 0 rgba(0,0,0,.55), 0 0 10px rgba(255,255,255,.14);
}


#bolusDocBtn .bolus-room-row {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 4px;
  width: 56px;
  flex: 0 0 56px;
}

#bolusDocBtn .bolus-room-seg {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  height: 30px;
  border-radius: 9px;
  border: 1px solid rgba(74,95,122,.32);
  background: rgba(6,10,17,.72);
  color: rgba(197,207,220,.72);
  font-size: 8px;
  font-weight: 900;
  letter-spacing: .10em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04), inset 0 -1px 0 rgba(0,0,0,.38), 0 2px 7px rgba(0,0,0,.26);
}

#bolusDocBtn .bolus-room-seg.is-fresh {
  border-color: rgba(52,215,191,.78);
  background: linear-gradient(180deg,rgba(56,214,187,.94),rgba(37,194,169,.90));
  color: #031b1a;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 0 0 1px rgba(52,215,191,.14), 0 0 13px rgba(52,215,191,.36);
}

#bolusDocBtn .bolus-room-seg.is-stale {
  border-color: rgba(255,76,96,.86);
  background: linear-gradient(180deg,rgba(129,32,42,.92),rgba(90,22,30,.92));
  color: #ffe8eb;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(255,76,96,.16), 0 0 13px rgba(255,76,96,.42);
  animation: bolusRoomBlink 1.15s ease-in-out infinite;
}

@keyframes bolusRoomBlink {
  0%,100% { filter: brightness(1); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(255,76,96,.16), 0 0 12px rgba(255,76,96,.34); }
  50% { filter: brightness(1.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 1px rgba(255,76,96,.28), 0 0 22px rgba(255,76,96,.70); }
}

@media (max-width: 390px) {
  :root {
    --dock-h: 72px;
  }

  #calendarEmbed {
    left: 0;
    right: 0;
    border-radius: 0;
  }

  .dock-btn {
    min-height: 46px;
    font-size: 8px;
  }

  #bolusDocBtn {
    gap: 5px;
    padding-left: 7px;
  }

  #bolusDocBtn .bolus-dock-title {
    font-size: 9px;
    letter-spacing: .10em;
  }

  #bolusDocBtn .bolus-room-row {
    width: 52px;

  <script>
  let _syncRaf = 0;
  let _nsOpen = false;

  function hideMobileDataLoader() {
    var loader = document.getElementById('mobileDataLoader');
    if (loader) loader.classList.add('is-hidden');
  }

  function watchMobileCards(attempt) {
    var frame = document.getElementById('calIframe');
    try {
      if (frame && frame.contentDocument && frame.contentDocument.querySelector('#grafiks-list .card')) {
        hideMobileDataLoader();
        return;
      }
    } catch (_e) {}
    if ((attempt || 0) < 100) setTimeout(function(){ watchMobileCards((attempt || 0) + 1); }, 100);
  }
  function syncShellLayout() {
    cancelAnimationFrame(_syncRaf);
    _syncRaf = requestAnimationFrame(function() {
      document.documentElement.style.setProperty('--dock-h', Math.max(50, Math.round(document.getElementById('dockShelf').getBoundingClientRect().height || 54)) + 'px');
      const iframe = document.getElementById('calIframe');
      if (iframe && iframe.contentWindow) {
        try {
          iframe.contentWindow.postMessage({
            type: 'hostLayoutChanged',
            radioVisible: false,
            radioHeight: 0,
            buttonBarHeight: Math.round(document.getElementById('dockShelf').getBoundingClientRect().height || 76)
          }, '*');
        } catch (_e) {}
      }
    });
  }

  function openStatsFromDock() {
    // Tiešs toggle (kā desktop) — NEVIS postMessage. Iframe klausās mk_open_stats
    // ar DIVIEM handleriem (viens atver, otrs pārslēdz), kas viens otru atceļ →
    // modālis uzreiz aizveras. Tieša izsaukšana to apiet.
    const iframe = document.getElementById('calIframe');
    const iwin = iframe && iframe.contentWindow;
    const idoc = iframe && (iframe.contentDocument || (iwin && iwin.document));
    if (!iwin || !idoc) return;
    const modal = idoc.getElementById('stats-modal');
    const isOpen = modal && modal.style.display && modal.style.display !== 'none';
    try {
      if (isOpen) {
        if (typeof iwin.closeStatsModal === 'function') iwin.closeStatsModal();
        else modal.style.display = 'none';
      } else if (typeof iwin.openStatsModal === 'function') {
        iwin.openStatsModal();
      }
    } catch (_e) {}
  }

  function openSettingsFromDock() {
    const iframe = document.getElementById('calIframe');
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'mk_open_settings' }, '*');
  }

  var _nsToggleAt = 0;
  function toggleNsFromParent() {
    // iOS var izšaut touchend + ghost click pēc ~300ms — bez šī sarga poga
    // atver un tūlīt aizver pārklājumu, izskatās, ka "nekas nenotika".
    var nowT = Date.now();
    if (nowT - _nsToggleAt < 400) return;
    _nsToggleAt = nowT;
    _nsOpen = !_nsOpen;
    const iframe = document.getElementById('calIframe');
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'toggleNs', open: _nsOpen }, '*');
    document.getElementById('nsToggleBtnParent').classList.toggle('is-active', _nsOpen);
  }

  function showInstallDialog() {
    const el = document.getElementById('pwaInstall');
    if (!el || typeof el.showDialog !== 'function') return;
    el.showDialog();
  }

  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'mk_stats_closed') document.getElementById('statsDocBtn').classList.remove('is-active');
    if (e.data.type === 'mk_stats_opened') document.getElementById('statsDocBtn').classList.add('is-active');
    if (e.data.type === 'mk_settings_closed') document.getElementById('settingsDockBtn').classList.remove('is-active');
    if (e.data.type === 'mk_settings_opened') document.getElementById('settingsDockBtn').classList.add('is-active');
    if (e.data.type === 'nsClosed') {
      _nsOpen = false;
      document.getElementById('nsToggleBtnParent').classList.remove('is-active');
    }
    if (e.data.type === 'minka:appReady') hideMobileDataLoader();
  });

  document.addEventListener('click', function(e) {
    const b = e.target.closest('button');
    if (!b) return;
    if (!window.AudioContext && !window.webkitAudioContext) return;
    try {
      if (!window.__dockAudioCtx) window.__dockAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const c = window.__dockAudioCtx;
      const o = c.createOscillator();
      const g = c.createGain();
      o.connect(g);
      g.connect(c.destination);
      o.type = 'sine';
      o.frequency.value = b.id === 'nsToggleBtnParent' ? 420 : 460;
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(0.035, c.currentTime + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.12);
      o.start(c.currentTime);
      o.stop(c.currentTime + 0.13);
    } catch (_e) {}
  }, true);

  document.addEventListener('DOMContentLoaded', function() {
    const iframe = document.getElementById('calIframe');
    if (iframe) iframe.addEventListener('load', function() {
      setTimeout(syncShellLayout, 90);
      watchMobileCards(0);
    });
    syncShellLayout();
    setTimeout(hideMobileDataLoader, 10000);
  });

  window.addEventListener('resize', syncShellLayout, { passive: true });
  window.addEventListener('orientationchange', function() { setTimeout(syncShellLayout, 220); }, { passive: true });

  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(syncShellLayout);
    ro.observe(document.documentElement);
    ro.observe(document.getElementById('dockShelf'));
  }
  </script>

<script>
  if ('serviceWorker' in navigator && /^https?:$/i.test(location.protocol)) {
    const MINKA_APP_VERSION = '2026.09.15-mobile-v2';
    const MINKA_VERSION_KEY = 'minka_mobile_app_version';
    const MINKA_RELOAD_KEY = 'minka_mobile_sw_reloading';
    function clearMinkaRuntimeCaches() {
      try {
        localStorage.removeItem('minka_schedule_cache_v2');
        localStorage.removeItem('minka_schedule_cache_ts_v2');
        localStorage.removeItem('minka_schedule_cache_v3');
        localStorage.removeItem('minka_schedule_cache_ts_v3');
        localStorage.removeItem('minka_emoji_v1');
      } catch (_e) {}
      return Promise.resolve();
    }
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(async (r) => {
          try {
            const prev = localStorage.getItem(MINKA_VERSION_KEY);
            if (prev !== MINKA_APP_VERSION) {
              await clearMinkaRuntimeCaches();
              localStorage.setItem(MINKA_VERSION_KEY, MINKA_APP_VERSION);
              await r.update();
            }
          } catch (_e) {}

          // A new version waits and is applied at a safe moment (js/app-update.js).
          if (window.__mkUpdates) window.__mkUpdates.watch(r);
          else if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });

          navigator.serviceWorker.addEventListener('controllerchange', () => {
            try {
              if (sessionStorage.getItem(MINKA_RELOAD_KEY) === MINKA_APP_VERSION) return;
              sessionStorage.setItem(MINKA_RELOAD_KEY, MINKA_APP_VERSION);
            } catch (_e) {}
            if (window.__mkUpdates) window.__mkUpdates.reloadWhenSafe(); else location.reload();
          });
        })
        .catch(function(e) { console.log('SW error:', e); });
    });
  }

/* iOS 27: a solid strip under the status bar. Without it Safari lays a
   progressive blur over whatever scrolls there and the clock area goes
   unreadable; with a solid element there it takes this colour instead. */
#mkStatusStrip{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#06101f;z-index:2147483000;pointer-events:none}
/* Full-page sheets on the phone: a top bar with back, the page below it. */
#planotajsSheet{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:0;z-index:5000;display:none;flex-direction:column;background:#0c0f14}
#planotajsSheet.is-open,#planotajsSheet.is-closing{display:flex}
#planotajsSheet.is-closing{pointer-events:none}
.mk-msheet-bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:56px;padding:0 8px;background:#0c0f14;border-bottom:1px solid #262c36;color:#e6ebf2}
.mk-msheet-bar h2{margin:0;font:600 18px/1 var(--font-ui,'Geist Sans',system-ui,sans-serif);letter-spacing:-.01em}
.mk-msheet-back{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mk-msheet-back:active{background:rgba(255,255,255,.1)}
.mk-msheet-back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#planotajsSheetFrame{flex:1 1 auto;width:100%;border:0;background:#0c0f14}
/* Bolus dock button: the desktop's parts (drop, GE/PH, BOLUS, crown) in a
   narrow phone cell; js/bolus.js keeps them and the progress ring current. */
.mobile-dock-grid{grid-template-columns:1fr 1.35fr 1fr 1fr 1fr !important}
#bolusDocBtn{flex-direction:column !important;align-items:center !important;justify-content:center !important;gap:2px !important;padding:4px 4px 3px !important}
#bolusDocBtn .bolus-top{display:flex;align-items:center;gap:4px}
#bolusDocBtn .bolus-top .dock-px{width:14px;height:14px;flex:0 0 14px}
#bolusDocBtn .bolus-room-row{display:flex !important;gap:3px !important;width:auto !important;flex:0 0 auto !important}
#bolusDocBtn .bolus-room-seg{width:22px;height:18px !important;border-radius:6px !important;font-size:7.5px !important;letter-spacing:.04em !important}
#bolusDocBtn .bolus-dock-title{flex:0 0 auto !important;font-size:9px !important;letter-spacing:.08em !important}
#bolusDocBtn .bolus-crown{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 7.5px/1 var(--font-ui,system-ui);letter-spacing:.04em;color:#f5b73f}
#bolusDocBtn .bolus-crown:empty{display:none}
#bolusDocBtn::before{border-radius:16px !important}
</style>
<script>
/* Phone navigation. Every open sheet gets one history entry, so the system
   back (Android button, iOS edge swipe) closes the top sheet instead of
   leaving the app. Calendar sheets report open/close (kalendars/js/
   mobile-sheets.js); the shell's own sheets call __mkSheetOpened/Closed. */
(function(){
  var stack = [], skipPop = 0;
  var SHELL = {
    bolus: function(){ if (window.toggleBolus) window.toggleBolus(false); },
    planner: function(){ if (window.closePlanotajsSheet) window.closePlanotajsSheet(); }
  };
  function opened(name){
    if (stack.indexOf(name) >= 0) return;
    stack.push(name);
    try { history.pushState({ mkSheet: name }, ''); } catch (_e) {}
  }
  function closed(name){
    var i = stack.lastIndexOf(name);
    if (i < 0) return;
    stack.splice(i, 1);
    // Closed with its own button: take its history entry back off.
    if (history.state && history.state.mkSheet === name) { skipPop++; history.back(); }
  }
  window.__mkSheetOpened = opened;
  window.__mkSheetClosed = closed;
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || !e.data || e.data.type !== 'mk-sheet') return;
    if (e.data.open) opened(e.data.name); else closed(e.data.name);
  });
  window.addEventListener('popstate', function(){
    if (skipPop) { skipPop--; return; }
    var name = stack.pop();
    if (!name) return;
    if (SHELL[name]) { SHELL[name](); return; }
    var f = document.getElementById('calIframe');
    try { f.contentWindow.postMessage({ type: 'mk-sheet-close', name: name }, location.origin); } catch (_e) {}
  });
})();

/* Bolus sheet: drag it down by its top (handle and title bar) to close,
   like the calendar's sheets (kalendars/js/mobile-sheets.js). */
(function(){
  var drag = null, sheet = null;
  function sheetEl(){ return sheet && sheet.isConnected ? sheet : (sheet = document.getElementById('bolus-sheet')); }
  document.addEventListener('pointerdown', function(e){
    var s = sheetEl();
    if (!s || !s.contains(e.target) || e.button !== 0) return;
    if (e.clientY - s.getBoundingClientRect().top > 72 || e.target.closest('button, input')) return;
    drag = { id: e.pointerId, y0: e.clientY, t0: e.timeStamp, dy: 0, on: false };
  }, true);
  document.addEventListener('pointermove', function(e){
    if (!drag || e.pointerId !== drag.id) return;
    var s = sheetEl(), dy = e.clientY - drag.y0;
    if (!drag.on) { if (dy < 8) { if (dy < -8) drag = null; return; } drag.on = true; s.style.transition = 'none'; }
    drag.dy = Math.max(0, dy);
    drag.v = drag.dy / Math.max(1, e.timeStamp - drag.t0);
    s.style.transform = 'translateY(' + drag.dy + 'px)';
  }, { passive: true });
  function end(e){
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag, s = sheetEl();
    drag = null;
    if (!d.on) return;
    if (d.dy > 110 || (d.v > .8 && d.dy > 30)) {
      s.style.transition = 'transform 200ms cubic-bezier(.3,0,.8,.15)';
      s.style.transform = 'translateY(100%)';
      setTimeout(function(){ if (window.toggleBolus) window.toggleBolus(false, true); s.style.removeProperty('transform'); s.style.removeProperty('transition'); }, 200);
    } else {
      s.style.transition = 'transform var(--mk-dur-spring-default, 560ms) var(--mk-ease-spring, ease)';
      s.style.transform = '';
      setTimeout(function(){ s.style.removeProperty('transition'); }, 600);
    }
  }
  document.addEventListener('pointerup', end, true);
  document.addEventListener('pointercancel', end, true);
})();

/* Plānotājs on the phone: the same planner app as on the desktop, as a full
   page under the status bar. Loaded on first open, kept for a few idle
   minutes after closing. */
(function(){
  var PLANNER = 'https://grafika-planotajs.pages.dev/', IDLE = 5 * 60 * 1000, unload = 0;
  var sheet = document.getElementById('planotajsSheet'), frame = document.getElementById('planotajsSheetFrame');
  function dockBtn(on){ var b = document.getElementById('planotajsDockBtn'); if (b) b.classList.toggle('is-active', on); }
  window.openPlanotajsLauncher = function(){
    if (sheet.classList.contains('is-open')) { window.closePlanotajsSheet(); return; }
    clearTimeout(unload);
    if (frame.src !== PLANNER) frame.src = PLANNER;
    sheet.classList.remove('is-closing');
    sheet.classList.add('is-open');
    sheet.setAttribute('aria-hidden', 'false');
    dockBtn(true);
    // Grows out of its dock button and returns into it (js/mk-motion.js).
    if (window.MinkaMotion) window.MinkaMotion.openSurface(sheet, { key: 'planner', origin: document.getElementById('planotajsDockBtn') });
    if (window.__mkSheetOpened) window.__mkSheetOpened('planner');
  };
  window.closePlanotajsSheet = function(){
    if (!sheet.classList.contains('is-open')) return;
    sheet.classList.remove('is-open');
    sheet.setAttribute('aria-hidden', 'true');
    dockBtn(false);
    if (window.MinkaMotion) {
      sheet.classList.add('is-closing');
      window.MinkaMotion.closeSurface(sheet, { key: 'planner', origin: document.getElementById('planotajsDockBtn') }, function(){ sheet.classList.remove('is-closing'); });
    }
    if (window.__mkSheetClosed) window.__mkSheetClosed('planner');
    clearTimeout(unload);
    unload = setTimeout(function(){ if (!sheet.classList.contains('is-open')) frame.src = 'about:blank'; }, IDLE);
  };
})();
</script>
