/* ════════════════════════════════════════════════════════════════
   DEŽŪRA PIN SYSTEM — adapted from lacitis.pages.dev
   Worker selects themselves, enters PIN (4-8 digits), favorites sync
   to Cloudflare via lacitis-api.gamernr1elite.workers.dev
   Endpoints:
     POST /dezura/v2/pin-status  — check if worker has a PIN
     POST /dezura/v2/login       — login/create PIN
     POST /dezura/v2/library/save — push favorites to cloud
     POST /dezura/v2/library/load — pull favorites from cloud
   ════════════════════════════════════════════════════════════════ */
const DEZURA_API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)?location.origin:'https://lacitis-api.gamernr1elite.workers.dev';
const DEZURA_SESSION_KEY = 'lacitis:dezura:session';
const DEZURA_LAUNCH_CACHE_KEY = 'lacitis:dezura:launch';

// Fallback workers for direct visits. Minka sends the real shift list by launch payload.
const DEZURA_FALLBACK_WORKERS = [
  {id:'demo-anna',  name:'Anna',  role:'', shift:'Dežūra'},
  {id:'demo-janis', name:'Jānis', role:'', shift:'Dežūra'},
  {id:'demo-laura', name:'Laura', role:'', shift:'Dežūra'},
];
const DEZURA_LAUNCH = getDezuraLaunch();
const DEZURA_WORKERS = DEZURA_LAUNCH.workers;

let dezuraSession = null;       // {workerId, name, role, shift, expiresAt}
let dezuraSelectedWorker = null; // currently selected worker in modal
let dezuraPinStatus = {};        // {workerId: hasPin}
let dezuraSyncTimer = null;

function nextShiftEnd(){
  const end = new Date();
  end.setHours(23,59,59,999);
  return end.getTime();
}

function slugId(name){
  return String(name || '')
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'') || 'worker';
}

function normalizeLaunchWorker(worker, index){
  const rawName = typeof worker === 'string' ? worker : worker?.name;
  const name = String(rawName || '').trim();
  if(!name) return null;
  const expiresAt = Number(worker?.expiresAt || 0) || nextShiftEnd();
  return {
    id: String(worker?.id || `minka-${slugId(name)}-${index}`),
    name,
    role: String(worker?.role || ''),
    shift: String(worker?.shift || 'Minka dežūra'),
    expiresAt,
  };
}

function decodeLaunchPayload(raw){
  if(!raw) return null;
  try{
    const normalized = String(raw).replace(/-/g,'+').replace(/_/g,'/');
    const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, '=');
    return JSON.parse(decodeURIComponent(escape(atob(padded))));
  }catch{
    try{ return JSON.parse(decodeURIComponent(raw)); }
    catch{ return null; }
  }
}

function cacheLaunchWorkers(workers){
  try{
    sessionStorage.setItem(DEZURA_LAUNCH_CACHE_KEY, JSON.stringify({
      workers,
      expiresAt: Math.max(...workers.map(w => Number(w.expiresAt || 0)), nextShiftEnd()),
    }));
  }catch{}
}

function readCachedLaunchWorkers(){
  try{
    const cached = JSON.parse(sessionStorage.getItem(DEZURA_LAUNCH_CACHE_KEY) || 'null');
    if(cached?.expiresAt && Date.now() < cached.expiresAt && Array.isArray(cached.workers)){
      const workers = cached.workers.map(normalizeLaunchWorker).filter(Boolean);
      if(workers.length) return workers;
    }
  }catch{}
  return [];
}

function getDezuraLaunch(){
  const params = new URLSearchParams(location.search);
  const launchParam = params.get('launch');
  const namePayload = typeof window.name === 'string' && window.name.startsWith('lacitis-launch:')
    ? decodeLaunchPayload(window.name.slice('lacitis-launch:'.length))
    : null;
  const payload = decodeLaunchPayload(launchParam) || namePayload;
  const rawWorkers = Array.isArray(payload?.workers) ? payload.workers : [];
  const fromLaunch = rawWorkers.map(normalizeLaunchWorker).filter(Boolean);
  if(fromLaunch.length){
    cacheLaunchWorkers(fromLaunch);
    if(launchParam){
      params.delete('launch');
      const next = location.pathname + (params.toString() ? `?${params}` : '') + location.hash;
      history.replaceState(null, '', next);
    }
    return {source:'launch', workers:fromLaunch};
  }

  const queryWorkers = (params.get('workers') || '')
    .split(',')
    .map(name => normalizeLaunchWorker(name))
    .filter(Boolean);
  if(queryWorkers.length){
    cacheLaunchWorkers(queryWorkers);
    return {source:'workers', workers:queryWorkers};
  }

  const cached = readCachedLaunchWorkers();
  if(cached.length) return {source:'cache', workers:cached};
  return {source:'fallback', workers:DEZURA_FALLBACK_WORKERS};
}

function isDezuraMode(){
  return new URLSearchParams(location.search).get('mode') === 'dezura';
}

function isEmbeddedDezura(){
  return isDezuraMode() && new URLSearchParams(location.search).get('embedded') === '1' && window.parent !== window;
}

function fullDezuraUrl(){
  const url = new URL(location.href);
  url.searchParams.set('mode','dezura');
  url.searchParams.delete('embedded');
  return url.toString();
}

function postToMinka(message){

}

/* ─── Session helpers (same as lacitis) ─── */
function dezuraGetSession(){
  if(MINI_EMBED)return null;
  try { return JSON.parse(sessionStorage.getItem(DEZURA_SESSION_KEY) || 'null'); }
  catch { return null; }
}
function dezuraSaveSession(session){
  sessionStorage.setItem(DEZURA_SESSION_KEY, JSON.stringify(session));
  dezuraSession = session;
}
function dezuraClearSession(){
  sessionStorage.removeItem(DEZURA_SESSION_KEY);
  dezuraSession = null;
}
function dezuraIsActive(){ return !!(dezuraSession?.sessionToken&&dezuraSession.expiresAt>Date.now()&&window.__lacLibraryReady!==false); }

/* ─── localStorage prefix for dezura worker (same as lacitis) ─── */
function dezuraPrefix(){
  if(!dezuraSession?.workerId) return '';
  return `lacitis:dezura:${dezuraSession.workerId}:`;
}
function dezuraLSKey(key){
  const p = dezuraPrefix();
  if(p && (key==='library_tracks' || key==='library_favorites' || key==='library_history' || key.startsWith('library_')))
    return p + key;
  return key;
}

/* ─── Library helpers ─── */
function libGet(key){
  try { return JSON.parse(localStorage.getItem(dezuraLSKey(key)) || (key.includes('tracks')?'{}':'[]')); }
  catch { return key.includes('tracks') ? {} : []; }
}
function libSet(key, val){ localStorage.setItem(dezuraLSKey(key), JSON.stringify(val)); }

function getTracksMap(){ return libGet('library_tracks'); }
function saveTracksMap(t){ libSet('library_tracks', t); }
function getFavorites(){ return libGet('library_favorites'); }
function saveFavorites(arr){ libSet('library_favorites', arr); }
function getHistory(){ return libGet('library_history'); }
function saveHistory(arr){ libSet('library_history', arr); }
function getListenLater(){ return libGet('library_listen_later'); }
function saveListenLater(arr){ libSet('library_listen_later', arr); }
function getPlaylists(){
  const value=libGet('library_playlists');
  return Array.isArray(value)?value.filter(item=>item&&item.id&&item.name&&Array.isArray(item.trackIds)):[];
}
function savePlaylists(arr){ libSet('library_playlists', arr); }

/* ─── Track upsert ─── */
function upsertTrack(track){
  const tracks = getTracksMap();
  if(!tracks[track.id]){
    tracks[track.id] = {
      id: track.id, title: track.title, author: track.author,
      duration: track.duration || '', thumbnail: track.thumbnail || '',
      modified: dezuraIsActive() ? Date.now() : undefined,
    };
    saveTracksMap(tracks);
  }
  return tracks[track.id];
}

/* ─── Favorites add/remove ─── */
function addToFavorites(track){
  upsertTrack(track);
  const favs = getFavorites();
  if(!favs.includes(track.id)){
    favs.unshift(track.id);
    saveFavorites(favs);
    state.liked.add(track.id);
    if(dezuraIsActive()) scheduleDezuraSync();
    window.__lacitisMiniProfileChanged?.();
  }
}
function removeFromFavorites(trackId){
  const favs = getFavorites();
  const idx = favs.indexOf(trackId);
  if(idx>=0){
    favs.splice(idx,1);
    saveFavorites(favs);
    state.liked.delete(trackId);
    if(dezuraIsActive()) scheduleDezuraSync();
    window.__lacitisMiniProfileChanged?.();
  }
}
function isFavorited(trackId){
  return state.liked.has(trackId) || getFavorites().includes(trackId);
}

/* ─── History ─── */
function addToHistory(track){
  upsertTrack(track);
  const hist = getHistory();
  const idx = hist.indexOf(track.id);
  if(idx>=0) hist.splice(idx,1);
  hist.unshift(track.id);
  if(hist.length > 200) hist.length = 200;
  saveHistory(hist);
  if(dezuraIsActive()) scheduleDezuraSync();
  window.__lacitisMiniProfileChanged?.();
}

/* ─── API: check pin-status ─── */
async function dezuraCheckPin(worker){
  try{
    const res = await fetch(DEZURA_API + '/dezura/v2/pin-status', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({workerId:worker.id, name:worker.name, role:worker.role||'', shift:worker.shift, expiresAt:worker.expiresAt||0}),
    });
    if(!res.ok) return undefined;
    const data = await res.json();
    return data.hasPin;
  }catch{ return undefined; }
}

/* ─── API: login (createPin or verify) ─── */
async function dezuraLogin(worker, pin, createPin, confirm, confirm){
  try{
    const res = await fetch(DEZURA_API + '/dezura/v2/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        workerId:worker.id, name:worker.name, role:worker.role||'',
        shift:worker.shift, expiresAt:worker.expiresAt||0,
        pin, createPin, confirm,
      }),
    });
    const data = await res.json().catch(()=>({}));
    if(res.status === 401) return {'wrong-pin':true, ...data};
    if(res.status === 404) return {'pin-required':true, ...data};
    if(!res.ok) return {ok:false, error:data.error || 'Login failed.'};
    return data;
  }catch{ return null; }
}

/* ─── API: library save/load (same as lacitis) ─── */
function dezuraBuildPayload(data){
  const s = dezuraSession;
  if(!s?.workerId || !s.name) return null;
  return {sessionToken:s.sessionToken, data};
}

function dezuraGetLibrarySnapshot(){
  const s = dezuraSession;
  if(!s?.workerId) return null;
  const library = {};
  for(let i=0; i<localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(dezuraPrefix()+'library_')){
      try { library[key.replace(dezuraPrefix(),'')] = JSON.parse(localStorage.getItem(key)); } catch {}
    }
  }
  return {library, drawer:{}};
}

async function dezuraSaveLibrary(){
  if(!dezuraIsActive()) return;
  const snapshot = dezuraGetLibrarySnapshot();
  const payload = dezuraBuildPayload(snapshot);
  if(!payload) return;
  try{
    const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
    navigator.sendBeacon(DEZURA_API + '/dezura/v2/library/save', blob);
  }catch(e){ console.warn('dezura save failed', e) }
}

async function dezuraLoadLibrary(){
  if(!dezuraIsActive()) return false;
  const payload = dezuraBuildPayload(null);
  if(!payload) return false;
  try{
    const res = await fetch(DEZURA_API + '/dezura/v2/library/load', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    if(!res.ok) return false;
    const result = await res.json();
    if(result?.data){
      dezuraApplyLibrary(result.data);
      return true;
    }
  }catch(e){ console.warn('dezura load failed', e) }
  return false;
}

function dezuraApplyLibrary(data){
  if(!data || typeof data !== 'object') return;
  const lib = data.library || data;
  for(const key in lib){
    if(key.startsWith('library_')){
      localStorage.setItem(dezuraLSKey(key), JSON.stringify(lib[key]));
    }
  }
  state.liked = new Set(getFavorites());
  renderLikedView();
  window.__lacitisMiniProfileChanged?.();
}

/* ─── Schedule debounced sync (900ms like lacitis) ─── */
function scheduleDezuraSync(){
  if(!dezuraIsActive()) return;
  if(dezuraSyncTimer) clearTimeout(dezuraSyncTimer);
  dezuraSyncTimer = setTimeout(()=>{
    dezuraSaveLibrary();
    dezuraSyncTimer = null;
  }, 900);
}

    ind.querySelector('span').textContent = status==='synced'?'Synced':status==='syncing'?'Syncing…':'Sync error';

async function renderDezuraWorkers(){
  dezuraWorkersEl.innerHTML = '<div style="color:var(--text-sub);font-size:.8125rem">Ielādē darbiniekus…</div>';
  // Check PIN status for each worker in parallel
  const workers = await Promise.all(DEZURA_WORKERS.map(async w => {
    if(dezuraPinStatus[w.id] === undefined){
      const hasPin = await dezuraCheckPin(w);
      dezuraPinStatus[w.id] = hasPin;
    }
    return {...w, hasPin: dezuraPinStatus[w.id]};
  }));
  dezuraWorkersEl.innerHTML = '';
  workers.forEach(w => {
    const btn = document.createElement('button');
    btn.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;background:var(--bg-elev2);color:var(--text);font-weight:600;transition:background .15s;border:1px solid transparent;cursor:pointer';
    btn.onmouseenter = () => { btn.style.background = '#333'; btn.style.borderColor = 'var(--green)' };
    btn.onmouseleave = () => { btn.style.background = 'var(--bg-elev2)'; btn.style.borderColor = 'transparent' };
    btn.innerHTML = `<span style="display:flex;align-items:center;gap:10px"><span class="user-avatar" style="width:32px;height:32px;background:${w.hasPin?'var(--green)':'var(--bg-elev2)'};color:${w.hasPin?'#000':'var(--text-sub)'}">${w.name[0]}</span>${esc(w.name)}</span><span style="font-size:.75rem;color:var(--text-sub)">${w.hasPin?'PIN iestatīts':'Jauns'}</span>`;
    btn.addEventListener('click', () => selectDezuraWorker(w));
    dezuraWorkersEl.appendChild(btn);
  });
}

function selectDezuraWorker(worker){
  dezuraSelectedWorker = worker;
  dezuraWorkersWrap.style.display = 'none';

dezuraSubmit.addEventListener('click', async ()=>{
  if(!dezuraSelectedWorker) return;
  const pin = dezuraPinInput.value.trim();
  const confirm = dezuraPinConfirmInput.value.trim();
  dezuraError.textContent = '';

  if(!/^\d{4,8}$/.test(pin)){ dezuraError.textContent = 'PIN jābūt 4 līdz 8 cipariem.'; return; }
  if(dezuraPinConfirmWrap.style.display !== 'none' && pin !== confirm){
    dezuraError.textContent = 'PIN atkārtojums nesakrīt.'; return;
  }

  const isCreate = dezuraPinConfirmWrap.style.display !== 'none';
  dezuraSubmit.disabled = true;
  dezuraSubmit.textContent = 'Pārbauda…';

  const result = await dezuraLogin(dezuraSelectedWorker, pin, isCreate, confirm);
  dezuraSubmit.disabled = false;

  if(!result){
    dezuraError.textContent = 'API nav sasniedzams.'; dezuraSubmit.textContent = isCreate?'Izveidot PIN':'Ieiet'; return;
  }
  if(result['wrong-pin']){ dezuraError.textContent = 'Nepareizs PIN.'; dezuraSubmit.textContent = 'Ieiet'; return; }
  if(result['pin-exists']){ dezuraError.textContent = 'PIN jau ir izveidots. Ievadi esošo PIN.'; dezuraPinConfirmWrap.style.display='none'; dezuraSubmit.textContent='Ieiet'; return; }
  if(result['pin-required']){ dezuraError.textContent = 'PIN ir nepieciešams.'; dezuraSubmit.textContent='Ieiet'; return; }
  if(!result.ok){ dezuraError.textContent = result.error || 'Login failed.'; dezuraSubmit.textContent = isCreate?'Izveidot PIN':'Ieiet'; return; }

  // Success — save session
  const expiresAt = Number(dezuraSelectedWorker.expiresAt || 0) || Date.now() + 8*60*60*1000; // shift-aware session
  dezuraSaveSession(result.session);
  dezuraPinStatus[dezuraSelectedWorker.id] = true;

  // Update UI
  setUserChip(dezuraSelectedWorker.name);
  $('#sync-indicator').style.display = 'flex';
  toast('Dežūra: ' + dezuraSelectedWorker.name);

  // Load library from cloud
  setDezuraSyncStatus('syncing');
  const loaded = await dezuraLoadLibrary();
  if(loaded){ toast('Favorites ielādēti no mākoņa'); }
  // Push current local library to cloud
  dezuraSaveLibrary();
  setDezuraSyncStatus('synced');

  notifyMinkaLogin();
  setTimeout(closeDezuraModal, isEmbeddedDezura() ? 400 : 1200);
  renderLikedView();
});

function restoreDezuraSession(){
  const session = dezuraGetSession();
  if(session?.workerId){
    // Check if session expired
    if(session.expiresAt && Date.now() >= session.expiresAt){
      dezuraClearSession();
      setUserChip('');
      return;
    }
    dezuraSession = session;
    setUserChip(session.name);
    $('#sync-indicator').style.display = 'flex';

    // Load library from cloud
    dezuraLoadLibrary().then(()=>{ setDezuraSyncStatus('synced'); renderLikedView(); });

}

const fullLyricsCache=new Map();
let fullLyricsActive=null;
let fullLyricsLine=-1;
function fullNormalizeLyrics(data,mlcTimed=false){
  if(Array.isArray(data?.lyrics)&&data.lyrics.length){
    const lines=data.lyrics.map(line=>{
      const words=Array.isArray(line?.syllabus)?line.syllabus.map(word=>word?.text||'').join(''):'';
      const raw=line?.time;
      return {
        time:raw!==null&&raw!==''&&Number.isFinite(Number(raw))?(mlcTimed?Number(raw)/1000:Number(raw)):null,
        text:String(line?.text||words||'').trim()
      };
    }).filter(line=>line.text);
    if(lines.length) return {lines,synced:lines.some(line=>Number.isFinite(line.time))};
  }
  const synced=[];
  String(data?.syncedLyrics||'').split(/\r?\n/).forEach(line=>{
    const matches=[...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const text=line.replace(/\[[^\]]+\]/g,'').trim();
    matches.forEach(match=>{ if(text) synced.push({time:Number(match[1])*60+Number(match[2]),text}); });
  });
  if(synced.length) return {lines:synced.sort((a,b)=>a.time-b.time),synced:true};
  const plain=String(data?.plainLyrics||'').split(/\r?\n/)
    .map(text=>({time:null,text:text.trim()})).filter(line=>line.text);
  return plain.length?{lines:plain,synced:false}:null;
}
async function fullLyricsJson(url){
  const timeout=timeoutSignal(8000);
  try{
    const response=await fetch(url,{headers:{Accept:'application/json'},signal:timeout.signal});
    if(!response.ok) throw new Error('HTTP '+response.status);
    return await response.json();
  }finally{ timeout.cleanup(); }
}
async function getFullLyrics(track){
  const id=String(track?.id||'');
  if(fullLyricsCache.has(id)) return fullLyricsCache.get(id);
  const meta=cleanMusicMeta(track);
  const base={id,title:meta.title,artist:meta.author};
  try{
    const url=`https://mlc-ytify.kouzu.in/api/lyrics/${encodeURIComponent(id)}?name=${encodeURIComponent(meta.title)}&artist=${encodeURIComponent(meta.author)}`;
    const normalized=fullNormalizeLyrics(await fullLyricsJson(url),true);
    if(normalized){
      const payload={...base,...normalized}; fullLyricsCache.set(id,payload); return payload;
    }
  }catch(error){ console.warn('Pilnā skata lyrics MLC kļūda',error.message); }
  try{
    const params=new URLSearchParams({track_name:meta.title,artist_name:meta.author});
    if(Number(track?.lengthSeconds)) params.set('duration',String(Math.round(track.lengthSeconds)));
    const normalized=fullNormalizeLyrics(await fullLyricsJson(`https://lrclib.net/api/get?${params}`));
    if(normalized){
      const payload={...base,...normalized}; fullLyricsCache.set(id,payload); return payload;
    }
  }catch(error){ console.warn('Pilnā skata lyrics LRCLIB kļūda',error.message); }
  return {...base,lines:[],synced:false,error:'Šai dziesmai lyrics nav atrasti.'};
}
function renderFullLyrics(payload){
  const body=$('#full-lyrics-body'); if(!body||!payload) return;
  fullLyricsActive=payload; fullLyricsLine=-1;
  $('#full-lyrics-title').textContent=payload.title||'Lyrics';
  $('#full-lyrics-artist').textContent=payload.artist||'';
  body.innerHTML='';
  if(!payload.lines?.length){
    body.innerHTML=`<div class="full-lyrics-state">${esc(payload.error||'Lyrics nav atrasti.')}</div>`; return;
  }
  const fragment=document.createDocumentFragment();
  payload.lines.slice(0,300).forEach((line,index)=>{
    const timed=Number.isFinite(Number(line.time));
    const element=document.createElement(timed?'button':'div');
    if(timed){ element.type='button'; element.dataset.time=String(Number(line.time)); }
    element.className='full-lyric-line';element.dataset.index=String(index);element.textContent=line.text;
    fragment.appendChild(element);
  });
  body.appendChild(fragment);
  updateFullLyricsPosition(true);
}
async function requestFullLyrics(){
  const track=state.current;
  const body=$('#full-lyrics-body');
  if(!track||isRadioMode){
    if(body) body.innerHTML='<div class="full-lyrics-state">Izvēlies dziesmu.</div>';

  }

}
function updateFullLyricsPosition(force=false){
  if(!fullPanelIsOpen('full-lyrics-panel')||!fullLyricsActive?.synced||!fullLyricsActive.lines?.length) return;
  const position=audio.currentTime||0;
  let low=0,high=fullLyricsActive.lines.length-1,found=-1;
  while(low<=high){
    const mid=(low+high)>>1,time=Number(fullLyricsActive.lines[mid]?.time);
    if(Number.isFinite(time)&&time<=position+.08){ found=mid; low=mid+1; }else high=mid-1;
  }
  if(!force&&found===fullLyricsLine) return;
  $('#full-lyrics-body .full-lyric-line.active')?.classList.remove('active');
  fullLyricsLine=found;
  const current=$(`#full-lyrics-body [data-index="${found}"]`);
  if(current){ current.classList.add('active'); current.scrollIntoView({behavior:LOW_POWER_DEVICE?'auto':'smooth',block:'center'}); }
}

  }else{
    // Minka keeps this iframe alive for a long time. Check for a newly
    // deployed Pages service worker and reload only the iframe when the new
    // worker takes control, so it cannot keep running stale player logic.
    let hadServiceWorkerController=!!navigator.serviceWorker.controller;
    let reloadingForUpdate=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(hadServiceWorkerController&&!reloadingForUpdate){
        reloadingForUpdate=true;
        location.reload();
      }
      hadServiceWorkerController=true;
    });
    const checkForPlayerUpdate=()=>document.hidden ? Promise.resolve() : navigator.serviceWorker.getRegistration()
      .then(registration=>registration?.update())
      .catch(()=>{});
    window.addEventListener('load',()=>setTimeout(checkForPlayerUpdate,1200));
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible') checkForPlayerUpdate();
    });
    setInterval(checkForPlayerUpdate,5*60*1000);

/* ════════════════════════════════════════════════════════════════
   MINKA MINI-EMBED BRIDGE — lightweight horizontal remote control
   Loaded with ?embed=mini inside Minka: expose a lightweight
   postMessage API so Minka renders the flat track list + controls
   while THIS document owns audio playback. Maximizing in Minka just
   reveals this same iframe, so music never restarts.
   ════════════════════════════════════════════════════════════════ */
(function(){
  function isMini(){ return MINI_EMBED; }
  if(!isMini()) return;
  const allowedParentOrigins=new Set([
    'https://rg2055.github.io',
    'http://localhost','http://127.0.0.1',
    'http://localhost:5500','http://127.0.0.1:5500',
    'http://localhost:8080','http://127.0.0.1:8080',
    'http://localhost:8745','http://127.0.0.1:8745'
  ]);
  let miniParentOrigin='*';
  let playbackMessage='';
  let miniWorkers=DEZURA_WORKERS.slice();
  const post=(msg)=>{ try{ window.parent.postMessage(msg,miniParentOrigin); }catch(e){} };
  window.__lacitisMiniProfileChanged=()=>sendMiniProfileState();
  window.__lacitisSoundChanged=status=>post({type:'lac_mini_sound',...status});
  const publicTrack=t=>{
    const meta=cleanMusicMeta(t);
    return {
      id:t.id,title:meta.title,author:meta.author,
      thumbnail:t.thumbnail||thumb(t.id,'default'),
      duration:t.duration||fmtDur(t.lengthSeconds),lengthSeconds:t.lengthSeconds||0
    };
  };
  const miniLyricsCache=new Map();
  const MINI_LYRICS_CACHE_PREFIX='lacitis:mini-lyrics:v2:';
  function parseMiniLrc(value){
    const out=[];
    String(value||'').split(/\r?\n/).forEach(line=>{
      const matches=[...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
      if(!matches.length) return;
      const text=line.replace(/\[[^\]]+\]/g,'').trim();
      if(!text) return;
      matches.forEach(match=>out.push({time:Number(match[1])*60+Number(match[2]),text}));
    });
    return out.sort((a,b)=>a.time-b.time);
  }
  function normalizeMiniLyrics(data,mlcTimed=false){
    if(Array.isArray(data?.lyrics)&&data.lyrics.length){
      const lines=data.lyrics.map(line=>{
        const words=Array.isArray(line?.syllabus)?line.syllabus.map(word=>word?.text||'').join(''):'';
        const rawTime=line?.time;
        return {
          time:rawTime!==null&&rawTime!==''&&Number.isFinite(Number(rawTime))?(mlcTimed?Number(rawTime)/1000:Number(rawTime)):null,
          text:String(line?.text||words||'').trim()
        };
      }).filter(line=>line.text);
      if(lines.length) return {lines,synced:lines.some(line=>Number.isFinite(line.time))};
    }
    const synced=parseMiniLrc(data?.syncedLyrics);
    if(synced.length) return {lines:synced,synced:true};
    const plain=String(data?.plainLyrics||data?.lyrics||'').split(/\r?\n/)
      .map(text=>({time:null,text:text.trim()})).filter(line=>line.text);
    return plain.length?{lines:plain,synced:false}:null;
  }
  function readMiniLyricsCache(id){
    if(miniLyricsCache.has(id)) return miniLyricsCache.get(id);
    try{
      const cached=JSON.parse(sessionStorage.getItem(MINI_LYRICS_CACHE_PREFIX+id)||'null');
      if(cached&&Date.now()-cached.savedAt<7*86400000&&Array.isArray(cached.lines)){
        miniLyricsCache.set(id,cached); return cached;
      }
    }catch(e){}
    return null;
  }
  function writeMiniLyricsCache(id,payload){
    miniLyricsCache.delete(id); miniLyricsCache.set(id,payload);
    if(miniLyricsCache.size>12) miniLyricsCache.delete(miniLyricsCache.keys().next().value);
    try{ sessionStorage.setItem(MINI_LYRICS_CACHE_PREFIX+id,JSON.stringify(payload)); }catch(e){}
  }
  async function fetchMiniLyricsJson(url){
    const timeout=timeoutSignal(8000);
    try{
      const response=await fetch(url,{headers:{Accept:'application/json'},signal:timeout.signal});
      if(!response.ok) throw new Error('HTTP '+response.status);
      return await response.json();
    }finally{ timeout.cleanup(); }
  }
  async function getMiniLyrics(track){
    const clean=cleanMusicMeta(track);
    const id=String(track?.id||'');
    const cached=readMiniLyricsCache(id);
    if(cached) return cached;
    const base={id,title:clean.title,artist:clean.author,savedAt:Date.now()};
    const mlcUrl=`https://mlc-ytify.kouzu.in/api/lyrics/${encodeURIComponent(id)}?name=${encodeURIComponent(clean.title)}&artist=${encodeURIComponent(clean.author)}`;
    try{
      const normalized=normalizeMiniLyrics(await fetchMiniLyricsJson(mlcUrl),true);
      if(normalized){
        const payload={...base,...normalized,source:'YTify MLC'};
        writeMiniLyricsCache(id,payload); return payload;
      }
    }catch(e){ console.warn('MLC lyrics failed',e.message); }
    try{
      const params=new URLSearchParams({track_name:clean.title,artist_name:clean.author});
      const duration=Number(track?.lengthSeconds||track?.duration||0);
      if(duration) params.set('duration',String(Math.round(duration)));
      const normalized=normalizeMiniLyrics(await fetchMiniLyricsJson(`https://lrclib.net/api/get?${params}`));
      if(normalized){
        const payload={...base,...normalized,source:'LRCLIB'};
        writeMiniLyricsCache(id,payload); return payload;
      }
    }catch(e){ console.warn('LRCLIB lyrics failed',e.message); }
    return {...base,lines:[],synced:false,error:'Šai dziesmai vārdi nav atrasti.'};
  }
  const miniWorkerId=(worker,index)=>String(worker?.id||`minka-${slugId(worker?.name||worker)}-${index}`);
  function setMiniWorkers(workers){
    const normalized=(workers||[]).map((worker,index)=>normalizeLaunchWorker({
      ...(typeof worker==='string'?{name:worker}:worker),
      id:miniWorkerId(worker,index)
    },index)).filter(Boolean);
    if(normalized.length){ miniWorkers=normalized; cacheLaunchWorkers(normalized); }
  }
  function miniLibraryTracks(section){
    let ids;
    if(section==='history') ids=getHistory();
    else if(String(section||'').startsWith('playlist:')){
      const playlistId=String(section).slice('playlist:'.length);
      ids=getPlaylists().find(item=>item.id===playlistId)?.trackIds||[];
    }else ids=getFavorites();
    const map=getTracksMap();
    return ids.map(id=>map[id]).filter(t=>t&&t.id).map(publicTrack);
  }
  function miniPlaylistSummaries(){
    return getPlaylists().map(item=>({id:item.id,name:item.name,count:item.trackIds.length,modified:item.modified||0}));
  }
  async function sendMiniProfileState(includePinStatus=false){
    const session=dezuraIsActive()?{
      workerId:dezuraSession.workerId,name:dezuraSession.name,
      role:dezuraSession.role||'',shift:dezuraSession.shift||'Dežūra',
      expiresAt:dezuraSession.expiresAt||0
    }:null;
    const base={
      type:'lac_mini_profile',session,syncStatus:dezuraSyncStatus.dataset.state||'',
      workers:miniWorkers.map(worker=>({
        id:worker.id,name:worker.name,role:worker.role||'',shift:worker.shift||'Dežūra',
        expiresAt:worker.expiresAt||0,
        hasPin:dezuraPinStatus[worker.id]
      })),
      favoriteIds:getFavorites(),playlists:miniPlaylistSummaries(),
      counts:{favorites:getFavorites().length,history:getHistory().length,playlists:getPlaylists().length}
    };
    post(base);
    if(includePinStatus&&!session){
      await Promise.all(miniWorkers.map(async worker=>{
        if(dezuraPinStatus[worker.id]===undefined) dezuraPinStatus[worker.id]=await dezuraCheckPin(worker);
      }));
      post({...base,workers:miniWorkers.map(worker=>({
        id:worker.id,name:worker.name,role:worker.role||'',shift:worker.shift||'Dežūra',
        expiresAt:worker.expiresAt||0,hasPin:dezuraPinStatus[worker.id]
      }))});
    }
  }
  function miniResult(action,ok,error='',extra={}){
    post({type:'lac_mini_profile_result',action,ok,error,...extra});
  }
  async function miniLogin(data){
    const worker=miniWorkers.find(item=>item.id===data.workerId);
    if(!worker){ miniResult('login',false,'Darbinieks nav atrasts.'); return; }
    const pin=String(data.pin||'').trim();
    if(!/^\d{4,8}$/.test(pin)){ miniResult('login',false,'PIN jābūt 4 līdz 8 cipariem.'); return; }
    const createPin=dezuraPinStatus[worker.id]===false;
    if(createPin&&pin!==String(data.confirm||'').trim()){
      miniResult('login',false,'PIN atkārtojums nesakrīt.'); return;
    }
    const result=await dezuraLogin(worker,pin,createPin,data.confirm);
    if(!result){ miniResult('login',false,'API nav sasniedzams.'); return; }
    if(result['wrong-pin']){ miniResult('login',false,'Nepareizs PIN.'); return; }
    if(result['pin-required']){ miniResult('login',false,'PIN nav izveidots.'); return; }
    if(!result.ok){ miniResult('login',false,result.error||'Neizdevās ielogoties.'); return; }
    dezuraSaveSession(result.session);
    dezuraPinStatus[worker.id]=true;
    setUserChip(worker.name);
    $('#sync-indicator').style.display='flex';
    setDezuraSyncStatus('syncing');
    await dezuraLoadLibrary();
    await dezuraSaveLibrary();
    setDezuraSyncStatus('synced');
    miniResult('login',true);
    sendMiniProfileState();
  }
  function miniToggleList(kind,data){
    try{
      if(!dezuraIsActive()){ miniResult(kind,false,'Vispirms ielogojies profilā.'); return; }
      const id=String(data.id||'');
      if(!id){ miniResult(kind,false,'Dziesma nav atrasta.'); return; }
      const track=publicTrack({id,title:data.title||'',author:data.author||'',thumbnail:data.thumbnail||thumb(id,'default'),duration:data.duration||'',lengthSeconds:data.lengthSeconds||0});
      upsertTrack(track);
      if(getFavorites().includes(id)) removeFromFavorites(id); else addToFavorites(track);
      miniResult(kind,true);
      sendMiniProfileState();
    }catch(error){
      console.error('mini library toggle failed',error);
      miniResult(kind,false,'Neizdevās saglabāt dziesmu.');
    }
  }
  function miniCreatePlaylist(data){
    if(!dezuraIsActive()){ miniResult('playlist_create',false,'Vispirms ielogojies profilā.'); return; }
    const name=String(data.name||'').trim().slice(0,60);
    if(!name){ miniResult('playlist_create',false,'Ievadi playlistes nosaukumu.'); return; }
    const playlists=getPlaylists();
    const playlist={id:'pl-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name,trackIds:[],createdAt:Date.now(),modified:Date.now()};
    playlists.unshift(playlist); savePlaylists(playlists); scheduleDezuraSync();
    miniResult('playlist_create',true,'',{playlistId:playlist.id}); sendMiniProfileState();
    post({type:'lac_mini_library',section:'playlist:'+playlist.id,tracks:[]});
  }
  function miniPlaylistTrack(action,data){
    if(!dezuraIsActive()){ miniResult(action,false,'Vispirms ielogojies profilā.'); return; }
    const playlists=getPlaylists(),playlist=playlists.find(item=>item.id===data.playlistId);
    if(!playlist){ miniResult(action,false,'Playliste nav atrasta.'); return; }
    const id=String(data.id||'');
    if(!id){ miniResult(action,false,'Dziesma nav atrasta.'); return; }
    if(action==='playlist_add'){
      const track=publicTrack({id,title:data.title||'',author:data.author||'',thumbnail:data.thumbnail||thumb(id,'default'),duration:data.duration||'',lengthSeconds:data.lengthSeconds||0});
      upsertTrack(track);
      const existing=playlist.trackIds.indexOf(id); if(existing>=0) playlist.trackIds.splice(existing,1);
      playlist.trackIds.unshift(id);
    }else{
      const existing=playlist.trackIds.indexOf(id); if(existing>=0) playlist.trackIds.splice(existing,1);
    }
    playlist.modified=Date.now(); savePlaylists(playlists); scheduleDezuraSync();
    miniResult(action,true); sendMiniProfileState();
    post({type:'lac_mini_library',section:'playlist:'+playlist.id,tracks:miniLibraryTracks('playlist:'+playlist.id)});
  }
  function miniDeletePlaylist(data){
    if(!dezuraIsActive()){ miniResult('playlist_delete',false,'Vispirms ielogojies profilā.'); return; }
    const playlists=getPlaylists(),next=playlists.filter(item=>item.id!==data.playlistId);
    if(next.length===playlists.length){ miniResult('playlist_delete',false,'Playliste nav atrasta.'); return; }
    savePlaylists(next); scheduleDezuraSync(); miniResult('playlist_delete',true); sendMiniProfileState();
  }
  function miniLogout(){
    if(dezuraIsActive()) dezuraSaveLibrary();
    dezuraClearSession();
    setUserChip('');
    $('#sync-indicator').style.display='none';
    miniResult('logout',true);
    sendMiniProfileState(true);
  }
  window.__lacitisMiniAppend=tracks=>{
    const payload=(tracks||[]).map(publicTrack);
    if(payload.length) post({type:'lac_mini_append',tracks:payload});
  };

  function trackDeck(){
    const seen=new Set(), out=[];
    const add=(arr)=>{ (arr||[]).forEach(t=>{ if(t&&t.id&&!seen.has(t.id)){ seen.add(t.id); out.push(publicTrack(t)); } }); };
    add(state.topTracks); add(state.rotation); add(state.madeFor);
    return out;
  }
  function sendDeck(){ const d=trackDeck(); if(d.length) post({type:'lac_mini_deck',tracks:d}); return d.length; }

  function npPayload(){
    const t=state.current||{};
    const meta=cleanMusicMeta(t);
    const player=activeAudio();
    const dur=(t.lengthSeconds||player.duration||0);
    return {type:'lac_mini_np', id:t.id||null, title:meta.title, author:meta.author,
      thumbnail:t.thumbnail||'', duration:dur, position:player.currentTime||0,
      pct: dur?Math.min(1,(player.currentTime||0)/dur):0,
      playing:!player.paused && !!player.src, loading:!!state.isLoading, message:playbackMessage };
  }
  const sendNp=()=>post(npPayload());
  const originalToast=toast, originalClearToast=clearToast;
  toast=function(message,error){ originalToast(message,error); playbackMessage=error?String(message):''; sendNp(); };
  clearToast=function(){ originalClearToast(); playbackMessage=''; sendNp(); };

  function findTrack(id){
    for(const list of [state.queue,state.topTracks,state.rotation,state.madeFor]){
      const f=(list||[]).find(t=>t&&t.id===id); if(f) return {track:f,list};
    }
    return null;
  }

  window.addEventListener('message',(e)=>{
    if(e.source!==window.parent) return;
    if(e.origin!==location.origin&&!allowedParentOrigins.has(e.origin)) return;
    miniParentOrigin=e.origin==='null'?'*':e.origin;
    const d=e.data; if(!d||typeof d!=='object'||d.type!=='lac_mini_cmd') return;
    switch(d.cmd){
      case 'deck': sendDeck(); sendNp(); break;
      case 'full': loadFullLacitisFromMini(); break;
      case 'play':
        if(Array.isArray(d.list)&&d.list.length){
          // Whole deck becomes the queue → auto-advances like YouTube/Spotify,
          // and Lācītis appends recommended tracks when the queue runs low.
          const list=d.list.filter(x=>x&&x.id).map(publicTrack);
          let idx=Math.max(0,Math.min(list.length-1, (typeof d.index==='number'?d.index:list.findIndex(x=>x.id===d.id))));
          if(idx<0) idx=0;
          playTrack(list[idx],list);
        } else if(d.id){ const hit=findTrack(d.id);
          if(hit) playTrack(hit.track,hit.list);
          else{ const t={id:d.id,title:d.title||'',author:d.author||'',thumbnail:d.thumbnail||thumb(d.id)}; playTrack(t,[t]); }
        } else togglePlay();
        break;
      case 'toggle': togglePlay(); break;
      case 'next': nextTrack(); break;
      case 'prev': prevTrack(); break;
      case 'seek': if(state.current&&state.current.lengthSeconds){ audio.currentTime=Math.max(0,Math.min(1,d.pct||0))*state.current.lengthSeconds; sendNp(); } break;
      case 'lyrics': {
        const requested=findTrack(d.id)?.track||state.current||d;
        getMiniLyrics(requested).then(payload=>post({type:'lac_mini_lyrics',...payload}));
        break;
      }
      case 'volume': state.volume=Math.max(0,Math.min(1,d.value)); state.muted=false; updateVolume(); break;
      case 'sound_get': post({type:'lac_mini_sound',...soundStatus()}); break;
      case 'sound_profile': {
        const status=setSoundProfile(String(d.profile||'off'));
        post({type:'lac_mini_sound',...status});
        break;
      }
      case 'profile_init': setMiniWorkers(d.workers); sendMiniProfileState(true); break;
      case 'profile_state': sendMiniProfileState(true); break;
      case 'shared_profile': window.lacApplySharedProfile?.(d.session); break;
      case 'profile_login': post({type:'lac_shared_login_request'}); break;
      case 'profile_logout': post({type:'lac_shared_logout_request'}); break;
      case 'profile_library': post({type:'lac_mini_library',section:d.section||'favorites',tracks:miniLibraryTracks(d.section)}); break;
      case 'profile_favorite': miniToggleList('favorite',d); break;
      case 'profile_playlist_create': miniCreatePlaylist(d); break;
      case 'profile_playlist_add': miniPlaylistTrack('playlist_add',d); break;
      case 'profile_playlist_remove': miniPlaylistTrack('playlist_remove',d); break;
      case 'profile_playlist_delete': miniDeletePlaylist(d); break;
      case 'profile_play': {
        const list=miniLibraryTracks(d.section||'favorites');
        const index=Math.max(0,list.findIndex(track=>track.id===d.id));
        if(list.length) playTrack(list[index]||list[0],list);
        setTimeout(()=>sendMiniProfileState(),300);
        break;
      }
      case 'more': (async()=>{
        // Endless deck: return upcoming tracks Minka doesn't have yet —
        // first from the play queue, then from cached/fetched recommendations.
        try{
          const have=new Set(d.ids||[]);
          const haveTracks=new Set((state.queue||[])
            .filter(t=>t&&have.has(t.id)).map(trackIdentity).filter(Boolean));
          let cand=(state.queue||[]).slice(Math.max(0,state.qIndex+1))
            .filter(t=>t&&t.id&&!have.has(t.id)&&!wasPlayed(t)&&!haveTracks.has(trackIdentity(t)));
          if(cand.length<5){
            const seedId=(d.ids&&d.ids[d.ids.length-1])||state.current?.id;
            if(seedId){
              try{
                const data=await getStreamData(seedId);
                cand=cand.concat((data.recommended||[]).filter(r=>
                  r&&r.id&&!have.has(r.id)&&!wasPlayed(r)&&!haveTracks.has(trackIdentity(r))
                ));
              }catch(e){}
            }
          }
          const seen=new Set(), seenTracks=new Set(), out=[];
          for(const t of cand){
            const identity=trackIdentity(t);
            if(!seen.has(t.id)&&(!identity||!seenTracks.has(identity))){
              seen.add(t.id); if(identity) seenTracks.add(identity);
              out.push(publicTrack(t));
            }
            if(out.length>=15) break;
          }
          // Rebuild the playback tail in the exact order shown by Minka.  This
          // removes stale/played queue entries that used to run before the
          // freshly appended deck and made old songs start again.
          const byId=new Map();
          [...state.queue,...out].forEach(t=>{ if(t?.id&&!byId.has(t.id)) byId.set(t.id,t); });
          const deck=(d.ids||[]).map(id=>byId.get(id)).filter(Boolean);
          out.forEach(t=>{ if(!deck.find(q=>q.id===t.id)) deck.push(t); });
          const currentDeckIndex=deck.findIndex(t=>t.id===state.current?.id);
          if(currentDeckIndex>=0){
            state.queue=deck;
            state.qIndex=currentDeckIndex;
          }else{
            const prefix=state.queue.slice(0,Math.max(0,state.qIndex+1));
            const prefixIds=new Set(prefix.map(t=>t.id));
            state.queue=prefix.concat(deck.filter(t=>!prefixIds.has(t.id)&&!wasPlayed(t)));
            state.qIndex=Math.max(0,prefix.length-1);
          }
          prefetchNext();
          post({type:'lac_mini_append', tracks:out});
        }catch(e){ post({type:'lac_mini_append', tracks:[]}); }
      })(); break;
      case 'search': (async()=>{
        const q=(d.q||'').trim();
        if(!q){ sendDeck(); return; }
        try{
          const res=await invidiousSearch(q);
          const tracks=(res||[]).filter(v=>v&&v.id).slice(0,12).map(publicTrack);
          post({type:'lac_mini_deck', tracks, query:q});
        }catch(e){ post({type:'lac_mini_deck', tracks:[], query:q}); }
      })(); break;
    }
  });

  // Broadcast now-playing only while audio advances, at most once per second.
  let _lastNp=0;
  audio.addEventListener('timeupdate',()=>{ const n=Date.now(); if(n-_lastNp>1000){ _lastNp=n; sendNp(); } });
  ['play','pause','loadedmetadata','ended'].forEach(ev=>audio.addEventListener(ev,sendNp));
  ['play','pause','loadedmetadata'].forEach(ev=>radioAudio.addEventListener(ev,sendNp));
  const _st=setPlayBtnLoading; setPlayBtnLoading=function(v){ _st(v); if(v) playbackMessage=''; queueMicrotask(sendNp); };

  post({type:'lac_mini_ready'});
  post({type:'lac_mini_sound',...soundStatus()});
  sendDeck();
  sendNp();
})();
</script>
