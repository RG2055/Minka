<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Lācītis — viegls mūzikas un radio atskaņotājs dežūrai.">
<meta name="theme-color" content="#111512">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo192.png">
<title>Lācītis 2.0</title>
<meta name="lacitis-release" content="20260907-playback-fix">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/registerSW.js" defer></script>
<!-- Lācītis — viegls pilna un mini skata mūzikas atskaņotājs. -->
<style>
:root{}
/* ─── Design Tokens (Spotify palette) ─────────────────────────── */
:root{
  --bg:#121212; --bg-elev:#181818; --bg-elev2:#282828; --bg-topbar:#0a0a0a;
  --player:#000000; --text:#FFFFFF; --text-sub:#B3B3B3;
  --green:#1DB954; --green-hover:#1ed760; --green-glow:rgba(29,185,84,.35);
  --border:rgba(255,255,255,.08); --radius:8px; --radius-sm:4px;
  --r-circle:50%; --sidebar-w:280px; --topbar-h:64px; --player-h:90px;
  --ease:cubic-bezier(.4,0,.2,1);
  font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img{display:block;max-width:100%}
input[type=range]{-webkit-appearance:none;-moz-appearance:none;appearance:none;background:transparent;cursor:pointer}

/* ─── App Shell ───────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:1fr var(--player-h);
  grid-template-areas:"sidebar main" "player player";height:100vh;width:100vw;gap:8px;padding:8px;background:var(--bg)}
.sidebar{grid-area:sidebar;min-height:0;display:flex;flex-direction:column;gap:8px}
.main{grid-area:main;min-height:0;display:flex;flex-direction:column;min-width:0}
.player{grid-area:player}

/* ─── Sidebar ─────────────────────────────────────────────────── */
.nav-block{background:var(--bg-elev);border-radius:8px;padding:8px 0}
.nav-logo{display:flex;align-items:center;gap:12px;padding:14px 18px 10px}
.brand-mark{display:block;width:68px;height:68px;flex:0 0 68px}
.brand-copy{display:flex;flex-direction:column;line-height:1}
.brand-name{font-size:20px;font-weight:900;color:#fff}
.brand-version{font-size:12px;font-weight:700;color:var(--green);margin-top:4px}
.nav-list{padding:0 8px}
.nav-item{display:flex;align-items:center;gap:20px;padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--text-sub);font-weight:700;letter-spacing:.02em;transition:color .15s var(--ease)}
.nav-item svg{width:24px;height:24px;flex-shrink:0;fill:currentColor}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--text)}

.library{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg-elev);border-radius:8px;padding:16px 0 8px}
.library-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px}
.library-title{display:flex;align-items:center;gap:14px;color:var(--text-sub);font-weight:700}
.library-title svg{width:24px;height:24px;fill:currentColor}
.library-title:hover{color:var(--text)}
.library-actions{display:flex;gap:8px}
.icon-soft{width:32px;height:32px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--text-sub);transition:color .15s,background .15s}
.icon-soft svg{width:16px;height:16px;fill:currentColor}
.icon-soft:hover{color:var(--text);background:var(--bg-elev2)}

.library-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 8px}
.lib-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s var(--ease)}
.lib-item:hover{background:var(--bg-elev2)}
.lib-cover{width:48px;height:48px;border-radius:var(--radius-sm);flex-shrink:0;-o-object-fit:cover;object-fit:cover;background:var(--bg-elev2)}
.lib-cover.circle{border-radius:var(--radius-sm)}
.lib-meta{min-width:0}
.lib-name{color:var(--text);font-size:.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-sub{color:var(--text-sub);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-sub .heart-dot{color:var(--green)}

/* ─── Top Bar ─────────────────────────────────────────────────── */
.topbar{height:var(--topbar-h);flex-shrink:0;background:var(--bg-topbar);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;border-radius:8px 8px 0 0;position:sticky;top:0;z-index:20;gap:16px}
.topbar.scrolled{background:var(--bg-topbar);}
.nav-arrows{display:flex;gap:8px}
.arrow-btn{width:32px;height:32px;border-radius:var(--radius-sm);background:rgba(0,0,0,.7);display:grid;place-items:center;color:var(--text-sub)}
.arrow-btn svg{width:18px;height:18px;fill:currentColor}
.arrow-btn:disabled{opacity:.4;cursor:not-allowed}
.topbar-center{flex:1;display:flex;justify-content:center;min-width:0}
.search-box{display:flex;align-items:center;gap:12px;background:var(--bg-elev2);border-radius:4px;padding:12px 16px;width:100%;max-width:364px;height:48px;transition:background .15s,border .15s;border:1px solid transparent}
.search-box:focus-within{background:#1f1f1f;border:1px solid var(--text-sub)}
.search-box svg{width:24px;height:24px;fill:var(--text-sub);flex-shrink:0}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:1rem;width:100%;font-weight:400}
.search-box input::-moz-placeholder{color:var(--text-sub)}
.search-box input::placeholder{color:var(--text-sub)}
.topbar-right{display:flex;align-items:center;gap:16px}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--bg-elev2);border-radius:4px;padding:4px 8px 4px 4px;transition:background .15s;height:32px}
.user-chip:hover{background:#333}
.user-avatar{width:24px;height:24px;border-radius:var(--radius-sm);background:var(--green);display:grid;place-items:center;font-weight:700;font-size:.75rem;color:#000;flex-shrink:0}
.user-name{font-size:.875rem;font-weight:700;white-space:nowrap}

/* ─── Main scroll area ────────────────────────────────────────── */
.scroll-main{flex:1;min-height:0;overflow-y:auto;background:linear-gradient(180deg,#1f1f1f 0%,var(--bg) 320px);padding:0 24px 24px;border-radius:0 0 8px 8px}
.section{margin-top:32px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.section-link{color:var(--text-sub);font-size:.875rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.section-link:hover{color:var(--text)}

/* ─── Card Grid ───────────────────────────────────────────────── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;content-visibility:auto;contain-intrinsic-size:auto 200px}
.card{background:var(--bg-elev);border-radius:var(--radius);padding:16px;cursor:pointer;position:relative;transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.card:hover{background:var(--bg-elev2);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.card-cover{width:100%;aspect-ratio:1;border-radius:var(--radius);-o-object-fit:cover;object-fit:cover;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.3);background:var(--bg-elev2)}
.card-cover.circle{border-radius:var(--radius-sm)}
.card-title{font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.card-desc{font-size:.875rem;color:var(--text-sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-play{position:absolute;right:24px;bottom:88px;width:48px;height:48px;border-radius:50%;background:var(--green);
  display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:opacity .15s,transform .15s,background .1s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.card-play svg{width:24px;height:24px;fill:#000}
.card:hover .card-play{opacity:1;transform:translateY(0)}
.card-play:hover{background:var(--green-hover);transform:scale(1.06)}

/* ─── Track List ──────────────────────────────────────────────── */
.list{display:flex;flex-direction:column}
.list-row{display:grid;grid-template-columns:40px 1fr auto 24px;align-items:center;gap:16px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-sub);transition:background .1s,color .1s}
.list-row:hover{background:var(--bg-elev2);color:var(--text)}
.list-row.playing{color:var(--green)}
.list-cover{width:40px;height:40px;border-radius:var(--radius-sm);-o-object-fit:cover;object-fit:cover;background:var(--bg-elev2)}
.list-title{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row:hover .list-title{color:var(--text)}
.list-row.playing .list-title{color:var(--green)}
.list-meta{color:var(--text-sub);font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-len{font-variant-numeric:tabular-nums;font-size:.875rem;min-width:40px;text-align:right}
.list-row .list-play{display:grid;place-items:center;width:24px}
.list-row .list-play svg{width:18px;height:18px;fill:currentColor}
.list-row .play-ico{display:block}
.list-row .pause-ico{display:none}
.list-row.playing.playing-now .play-ico{display:none}
.list-row.playing.playing-now .pause-ico{display:block}

/* ─── Loading skeleton ────────────────────────────────────────── */
.skeleton{background:var(--bg-elev2);border-radius:var(--radius);
  background-image:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.06) 20%,rgba(255,255,255,.10) 40%,transparent 60%);
  background-size:200% 100%;background-repeat:no-repeat;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
.low-power .skeleton{animation:none}
.sk-card{padding:16px}
.sk-cover{width:100%;aspect-ratio:1;border-radius:var(--radius);margin-bottom:16px}
.sk-line{height:14px;border-radius:4px;margin-bottom:8px}
.sk-line.short{width:60%}


/* ─── Radio Record ────────────────────────────────────────────── */
.radio-chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.radio-chip{padding:8px 16px;border-radius:var(--radius-sm);background:var(--bg-elev2);color:var(--text-sub);font-size:.8125rem;font-weight:700;transition:background .15s,color .15s,transform .12s}
.radio-chip:hover{color:var(--text);transform:scale(1.04)}
.radio-chip.active{background:var(--text);color:#000}
.radio-cover-wrap{position:relative;width:100%;aspect-ratio:1;margin-bottom:16px;max-height:160px}
@media(max-width:420px){.radio-cover-wrap{max-height:120px}}
@media(max-width:360px){.radio-cover-wrap{max-height:100px}}
.radio-cover-wrap .card-cover{width:100%;height:100%;border-radius:var(--radius);-o-object-fit:cover;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.radio-cover-wrap .card-cover{image-rendering:auto}
.radio-cover-wrap .card-cover[src*="radio-default"]{-o-object-fit:contain;object-fit:contain;padding:20%;filter:none}
.radio-card.active .radio-cover-wrap{outline:2px solid var(--green);outline-offset:2px}
.radio-card{content-visibility:auto;contain-intrinsic-size:190px 250px}
.radio-card.unavailable{opacity:.52;cursor:not-allowed}
.radio-card.unavailable:hover{transform:none;background:var(--bg-elev)}
.radio-card.unavailable .card-cover{filter:grayscale(.65)}
.radio-card.unavailable .card-play{display:none}
.radio-status{display:inline-flex;align-items:center;margin-top:6px;color:var(--text-sub);font-size:.6875rem;font-weight:700}
.radio-empty{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:96px;padding:20px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-sub);background:var(--bg-elev)}
.radio-empty strong{display:block;margin-bottom:4px;color:var(--text);font-size:.9375rem}
.radio-empty button{flex:0 0 auto;padding:8px 14px;border-radius:var(--radius-sm);background:var(--text);color:#000;font-size:.8125rem;font-weight:700}
.view-toggle{display:flex;gap:4px;background:var(--bg-elev2);border-radius:var(--radius-sm);padding:3px}
.view-toggle button{width:30px;height:30px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text-sub);cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s}
.view-toggle button:hover{color:var(--text)}
.view-toggle button.active{background:var(--text);color:#000;border-radius:var(--radius-sm)}
.view-toggle button svg{width:16px;height:16px;fill:currentColor}
.radio-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.radio-header .radio-chips{margin:0}
/* List view mode for radio grid */
#radio-grid.list-view{display:flex;flex-direction:column;gap:2px}
#radio-grid.list-view .radio-card{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:8px;border-radius:var(--radius-sm);background:var(--bg-elev);cursor:pointer}
#radio-grid.list-view .radio-card:hover{background:var(--bg-elev2)}
#radio-grid.list-view .radio-cover-wrap{width:48px;height:48px;max-height:48px;margin-bottom:0;aspect-ratio:unset}
#radio-grid.list-view .radio-cover-wrap .card-cover{border-radius:var(--radius-sm);box-shadow:none}
#radio-grid.list-view .radio-eq{bottom:2px;left:2px;height:14px}
#radio-grid.list-view .radio-eq span{width:2px}
#radio-grid.list-view .card-title{font-size:.875rem;margin-bottom:0}
#radio-grid.list-view .card-desc{display:none}
#radio-grid.list-view .card-play{opacity:1;transform:none;position:static;width:32px;height:32px;box-shadow:none}
#radio-grid.list-view .card-play svg{width:16px;height:16px}
#radio-grid.list-view .radio-card.active{outline:none}
#radio-grid.list-view .radio-card.active .radio-cover-wrap{outline:2px solid var(--green);outline-offset:1px}
/* Live equalizer bars animation on the cover of the playing station */
.radio-eq{position:absolute;bottom:12px;left:12px;display:none;gap:3px;align-items:flex-end;height:20px;will-change:transform}
.radio-eq.playing{display:flex}
.radio-eq span{width:3px;height:100%;background:var(--green);border-radius:2px;animation:eqbar 0.9s ease-in-out infinite}
.radio-eq span:nth-child(2){animation-delay:.15s}
.radio-eq span:nth-child(3){animation-delay:.3s}
.radio-eq span:nth-child(4){animation-delay:.45s}
@keyframes eqbar{0%,100%{height:30%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.radio-eq span{animation:none;height:50%}}
.low-power .radio-eq span{animation:none;height:50%}
/* LIVE badge in player bar when streaming radio */
.player.live .time{color:var(--green);font-weight:700}
.player.live .progress-bar{cursor:default}
.player.live .progress-fill{background:var(--green);width:100%!important}
.player.live #shuffle-btn,.player.live #repeat-btn,.player.live .like-btn,
.player.live #full-playlist-btn,.player.live #full-lyrics-btn,.player.live #full-sound-btn{display:none;pointer-events:none}
.player.live #progress-thumb{display:none}


/* ─── Login Modal + Sync ──────────────────────────────────────── */
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);;z-index:200;display:none;align-items:center;justify-content:center}
.login-overlay.show{display:flex}
.login-modal{background:var(--bg-elev);border-radius:var(--radius-sm);padding:32px;width:100%;max-width:400px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.login-modal h2{font-size:1.5rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.login-modal h2 svg{width:28px;height:28px}
.login-modal p{color:var(--text-sub);font-size:.875rem;margin-bottom:24px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:.75rem;color:var(--text-sub);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.login-field input{width:100%;padding:12px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.9375rem;outline:none;transition:border .15s}
.login-field input:focus{border-color:var(--green)}
.login-submit{width:100%;padding:14px;border-radius:var(--radius-sm);background:var(--green);color:#000;font-weight:700;font-size:.9375rem;transition:background .15s,transform .12s;margin-top:8px}
.login-submit:hover{background:var(--green-hover);transform:scale(1.02)}
.login-submit:active{transform:scale(.98)}
.login-submit:disabled{background:var(--text-sub);cursor:not-allowed;transform:none}
.login-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--text-sub);transition:color .15s}
.login-close:hover{color:var(--text)}
.login-close svg{width:20px;height:20px;fill:currentColor}
.login-error{color:#e22134;font-size:.8125rem;margin-top:8px;min-height:18px}
.sync-status{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text-sub);margin-top:12px}
.sync-dot{width:8px;height:8px;border-radius:var(--radius-sm);background:var(--text-sub)}
.sync-dot.synced{background:var(--green)}
.sync-dot.syncing{background:#faa61a;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Sync indicator in top bar */
.sync-indicator{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-sm);background:var(--bg-elev2);font-size:.75rem;color:var(--text-sub);cursor:pointer;transition:background .15s}
.sync-indicator:hover{background:#333}
.sync-indicator.synced{color:var(--green)}
.sync-indicator svg{width:14px;height:14px;fill:currentColor}

/* ─── Bottom Now-Playing Bar ──────────────────────────────────── */
.player{background:var(--player);height:var(--player-h);display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 16px;border-radius:8px;contain:layout style paint}
.player-left{display:flex;align-items:center;gap:12px;min-width:0}
.player-cover{width:56px;height:56px;border-radius:var(--radius-sm);-o-object-fit:cover;object-fit:cover;flex-shrink:0;background:var(--bg-elev2)}
.player-cover:not([src]),.player-cover[src=""]{display:none}
.player-cover-placeholder{width:56px;height:56px;border-radius:var(--radius-sm);flex-shrink:0;background:var(--bg-elev2);display:grid;place-items:center;color:var(--text-sub)}
.player-cover:not([src=""])~.player-cover-placeholder,.player-cover[src]:not([src=""])~.player-cover-placeholder{display:none}
.player-meta{min-width:0}
.player-track{font-size:.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-artist{font-size:.75rem;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.like-btn{color:var(--text-sub);display:grid;place-items:center;padding:8px;transition:color .15s,transform .15s}
.like-btn svg{width:18px;height:18px;fill:currentColor}
.like-btn:hover{color:var(--text);transform:scale(1.08)}
.like-btn.liked{color:var(--green)}
.like-btn.liked svg{fill:var(--green)}

.player-center{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:722px;margin:0 auto;width:100%}
.controls{display:flex;align-items:center;gap:16px}
.ctrl-btn{color:var(--text-sub);display:grid;place-items:center;position:relative;transition:color .15s,transform .12s}
.ctrl-btn svg{width:18px;height:18px;fill:currentColor}
.ctrl-btn:hover{color:var(--text)}
.ctrl-btn.active{color:var(--green)}
.ctrl-btn.active::after{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;border-radius:var(--radius-sm);background:var(--green);transform:translateX(-50%)}
.play-center{width:32px;height:32px;border-radius:50%;background:var(--text);display:grid;place-items:center;transition:transform .12s,background .15s}
.play-center svg{width:16px;height:16px;fill:#000}
.play-center:hover{transform:scale(1.08);background:#fff}
.play-center:active{transform:scale(.94)}
.play-center.loading{background:var(--text-sub);pointer-events:none}

.progress-row{display:flex;align-items:center;gap:8px;width:100%}
.time{font-size:.6875rem;color:var(--text-sub);font-variant-numeric:tabular-nums;min-width:40px}
.time.current{text-align:right}
.time.total{text-align:left}
.progress-bar{flex:1;height:4px;border-radius:2px;background:var(--bg-elev2);position:relative;overflow:hidden;cursor:pointer}
.progress-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--text-sub);border-radius:2px;transition:width .1s linear,background .15s}
.progress-bar:hover .progress-fill{background:var(--green)}
.progress-bar:hover .progress-thumb{opacity:1}
.progress-thumb{position:absolute;top:50%;width:12px;height:12px;border-radius:var(--radius-sm);background:#fff;transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;pointer-events:none}

.player-right{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.vol-btn{color:var(--text-sub);display:grid;place-items:center;padding:8px;transition:color .15s}
.vol-btn svg{width:18px;height:18px;fill:currentColor}
.vol-btn:hover{color:var(--text)}
.vol-bar{width:104px;height:4px;border-radius:2px;background:var(--bg-elev2);position:relative;overflow:hidden;cursor:pointer}
.vol-fill{position:absolute;left:0;top:0;bottom:0;width:70%;background:var(--text-sub);border-radius:2px;transition:background .15s}
.vol-bar:hover .vol-fill{background:var(--green)}

/* ─── Scrollbars ──────────────────────────────────────────────── */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:padding-box}

/* ─── Toast ───────────────────────────────────────────────────── */
.toast{position:fixed;bottom:calc(var(--player-h) + 16px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--green);color:#000;font-weight:700;padding:12px 20px;border-radius:var(--radius-sm);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;font-size:.875rem;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#e22134;color:#fff}

/* ─── Responsive ──────────────────────────────────────────────── */

/* Mobile tab bar — only visible on mobile via media query */
.mobile-tabbar{display:none}

/* ─── Responsive breakpoints ─────────────────────────────────────
   Desktop (>1024px):  full sidebar + 3-col player
   Tablet  (769-1024): icon-only sidebar
   Mobile  (≤768px):   bottom tab bar (Spotify-style), compact player
   Tiny    (≤420px):   2-col cards, minimal controls
   ──────────────────────────────────────────────────────────── */

/* Tablet: collapse sidebar to icons only */
@media (max-width:1024px){
  :root{--sidebar-w:72px}
  .nav-item span,.library-title span,.lib-meta,.create-pill .lib-meta{display:none}
  .nav-logo span{display:none}
  .nav-logo{display:grid;place-items:center;padding:16px 0 8px}
  .nav-logo{padding:14px 0 8px}
  .brand-mark{width:42px;height:42px;flex-basis:42px}
  .nav-item{justify-content:center;padding:12px}
  .library-head{justify-content:center;padding:0}
  .library-actions{display:none}
  .lib-item{justify-content:center;padding:8px}
  .lib-item .lib-meta{display:none}
  .create-pill{justify-content:center;padding:8px}
  .create-pill .lib-meta{display:none}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}

/* Mobile: Spotify phone layout — bottom tab bar, no sidebar */
@media (max-width:768px){
  :root{--sidebar-w:0px;--player-h:64px;--topbar-h:56px}
  /* App becomes single column — sidebar hidden, tab bar at bottom */
  .app{
    grid-template-columns:1fr;
    grid-template-rows:1fr var(--player-h) 56px;
    grid-template-areas:"main" "player" "tabbar";
    gap:0;padding:0;
  }
  .sidebar{display:none}
  /* Bottom tab bar (Spotify mobile) */
  .mobile-tabbar{
    display:flex;align-items:center;justify-content:space-around;
    background:#000;grid-area:tabbar;height:56px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .tab-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--text-sub);font-size:.6875rem;font-weight:700;
    padding:8px 12px;transition:color .15s;cursor:pointer;
  }
  .tab-item svg{width:24px;height:24px;fill:currentColor}
  .tab-item.active{color:#fff}
  .tab-item:active{color:var(--green)}
  /* Top bar — simpler on mobile */
  .topbar{height:var(--topbar-h);border-radius:0;padding:0 12px}
  .nav-arrows{display:none}
  .search-box{max-width:100%}
  .topbar-center{flex:1;display:flex}
  .user-name{display:none}
  .user-chip{padding:4px}
  .sync-indicator{padding:4px 8px}
  .sync-indicator span{display:none}
  /* Main content — full bleed */
  .scroll-main{padding:0 16px 16px;border-radius:0}
  .section{margin-top:20px}
  .section-title{font-size:1.25rem}
  .card-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .card{padding:8px}
  .card-cover{margin-bottom:8px;aspect-ratio:1;border-radius:6px;max-height:160px}
  .card-title{font-size:.8125rem}
  .card-desc{font-size:.6875rem;-webkit-line-clamp:1}
  .card-title{font-size:.875rem}
  .card-desc{font-size:.75rem}
  .card-play{width:40px;height:40px;right:12px;bottom:80px}
  .card-play svg{width:18px;height:18px}
  /* Compact player bar (Spotify mobile) */
  .player{
    grid-template-columns:1fr auto;height:var(--player-h);
    border-radius:0;padding:8px 12px;gap:12px;
  }
  .player-left{gap:8px}
  .player-cover,.player-cover-placeholder{width:40px;height:40px}
  .player-track{font-size:.8125rem}
  .player-artist{font-size:.6875rem}
  .player-left .like-btn{padding:4px}
  .player-left .like-btn svg{width:16px;height:16px}
  .radio-empty{align-items:flex-start;flex-direction:column}
  /* Hide center controls on mobile — just play/pause on the right */
  .player-center{display:none}
  .player-right{display:none}
  /* Mobile play button on the right side of compact player */
  .mobile-play{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;color:var(--text)}
  .mobile-play svg{width:24px;height:24px;fill:currentColor}
  /* Library/liked items simpler */
  .list-row{grid-template-columns:40px 1fr auto;gap:12px;padding:6px}
  .list-row .list-play{display:none}
  .list-len{font-size:.75rem}
}

/* Tiny phone: even more compact */
@media (max-width:420px){
  :root{--player-h:60px}
  .scroll-main{padding:0 12px 12px}
  .card-grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .card{padding:6px}
  .card-cover{margin-bottom:6px;border-radius:4px;max-height:120px}
  .card-title{font-size:.75rem}
  .card-desc{display:none}
  .card-play{width:32px;height:32px;right:8px;bottom:64px}
  .card-play svg{width:16px;height:16px}
  .section-title{font-size:1.125rem}
  .search-box{padding:8px 12px;height:40px}
  .search-box svg{width:18px;height:18px}
  .search-box input{font-size:.875rem}
  .player{padding:6px 10px}
  .player-cover,.player-cover-placeholder{width:36px;height:36px}
  .greeting{font-size:1.5rem}
}

/* Very narrow phones — compact covers */
@media (max-width:360px){
  .card-grid{grid-template-columns:repeat(3,1fr);gap:4px}
  .card{padding:4px}
  .card-cover{margin-bottom:4px;max-height:100px}
  .card-title{font-size:.6875rem}
  .card-play{width:28px;height:28px;right:6px;bottom:56px}
}

/* Landscape phone: slightly wider cards */
@media (max-width:768px) and (orientation:landscape){
  .card-grid{grid-template-columns:repeat(3,1fr)}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═══ LĀCĪTIS FULL VIEW — same visual system as the Minka mini player ═══ */
:root{
  --bg:#050706;--bg-elev:#111412;--bg-elev2:#1a1e1b;--bg-topbar:#070908;
  --player:#030403;--text:#f7faf8;--text-sub:#929a95;
  --green:#1ed760;--green-hover:#42e77b;--green-glow:rgba(30,215,96,.24);
  --border:rgba(255,255,255,.09);--radius:12px;--radius-sm:9px;
  --sidebar-w:222px;--topbar-h:62px;--player-h:112px;

}
body{background:#020302;font-size:14px}
button:focus-visible,[role=button]:focus-visible,input:focus-visible{

.app{

  grid-template-rows:1fr var(--player-h);

.sidebar{

}
.nav-block,.library{background:transparent;border-radius:0}

.nav-logo{gap:10px;padding:6px 8px 12px}

.brand-name{font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.brand-version{font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.nav-list{display:grid;gap:4px;padding:0}
.nav-list li{min-width:0}
.nav-item{
  width:100%;min-height:42px;gap:12px;padding:9px 11px;border:1px solid transparent;

.main{background:#050706}

.topbar-right{gap:8px}
.user-chip,.sync-indicator{

.card{
  min-width:0;height:76px;display:grid;grid-template-columns:58px minmax(0,1fr) 36px;

}

function lruSet(cache,key,value,limit){
  if(cache.has(key)) cache.delete(key);
  cache.set(key,value);
  while(cache.size>limit) cache.delete(cache.keys().next().value);
  return value;
}

function shuffle(a){const b=[...a];let i=b.length;while(i){const j=Math.floor(Math.random()*i--);[b[i],b[j]]=[b[j],b[i]]}return b}

// yt-style thumbnail: use i.ytimg.com directly (fast, reliable, CORS-permissive for <img>)
function thumb(videoId, quality='mqdefault'){return `https://i.ytimg.com/vi/${videoId}/${quality}.jpg`}

function orderedInstances(){
  const list = currentProxy
    ? [...YTIFY_STREAM_BACKENDS.filter(p=>p.base===currentProxy), ...YTIFY_STREAM_BACKENDS.filter(p=>p.base!==currentProxy)]
    : shuffle(YTIFY_STREAM_BACKENDS);
  return list.length ? list : YTIFY_STREAM_BACKENDS;
}

function timeoutSignal(ms, externalSignal){
  const controller=new AbortController();
  const abort=()=>controller.abort();
  const tid=setTimeout(abort,ms);
  const cleanup=()=>{
    clearTimeout(tid);
    externalSignal?.removeEventListener('abort',abort);
  };
  if(externalSignal){
    if(externalSignal.aborted) abort();
    else externalSignal.addEventListener('abort',abort,{once:true});
  }
  return {signal:controller.signal, cleanup};
}

// Adapted from ytify d806b3b: never reuse a failed stream URL.
function invalidateStreamData(id){
  for(const key of vidCache.keys()) if(key.endsWith(':'+id)) vidCache.delete(key);
  if(_prefetchedId===id) _prefetchedId=null;
}
function cachedStreamData(key){
  const data=lruGet(vidCache,key);
  if(!data) return;
  const expired=Date.now()-(data.cachedAt||0)>5*60*1000 || data.audioStreams.some(stream=>{
    try {
      const expiry=Number(new URL(stream.url).searchParams.get('expire'));
      return expiry>0 && expiry*1000<Date.now()+30000;
    } catch(_) { return true; }
  });
  if(expired){ vidCache.delete(key); return; }
  return data;
}

// Codec support (ytify logic): opus preferred, AAC fallback
const supportsOpus = document.createElement('audio').canPlayType('audio/webm; codecs="opus"') !== '';
const supportsAAC  = document.createElement('audio').canPlayType('audio/mp4; codecs="mp4a.40.2"') !== '';
const PREFERRED_ITAGS = supportsOpus ? [251,250,249] : [140,139];

/* search — returns [{id,title,author,duration,thumbnail}] */
async function invidiousSearch(query, signal){
  const q=String(query||'').trim(); if(!q) return [];
  const wantsNonSong=/\b(?:reaction|interview|review|behind\s+the\s+scenes|tutorial)\b/i.test(q);
  const cacheKey=q.toLocaleLowerCase();
  const cached=lruGet(searchCache,cacheKey); if(cached) return cached;
  const endpoints=[
    {url:`${YTIFY_API}/search?q=${encodeURIComponent(q)}&f=song`, kind:'ytify'},
    {url:`${YTIFY_API}/search?q=${encodeURIComponent(q)}&f=relevance`, kind:'ytify'},
    ...SEARCH_FALLBACKS.map(proxy => ({url:`${proxy}/api/v1/search?q=${encodeURIComponent(q)}&type=video`, kind:'invidious'}))
  ];
  for(const endpoint of endpoints){
    try{
      const timeout=timeoutSignal(5000,signal);
      let data;
      try{
        const res=await fetch(endpoint.url,{headers:{Accept:'application/json'},signal:timeout.signal});
        if(!res.ok) throw new Error('HTTP '+res.status);
        data=await res.json();
      }finally{
        timeout.cleanup();
      }
      if(!Array.isArray(data)) throw new Error('Invalid response');
      const out=data.map(v=>{
        const id = endpoint.kind === 'invidious' ? v.videoId : v.id;
        const lengthSeconds = typeof v.lengthSeconds === 'number' ? v.lengthSeconds : parseDuration(v.duration || '');
        return cleanTrackMetadata({
        id, title:v.title||'Nezināma dziesma', author:v.author||'',
        duration:v.duration || fmtDur(lengthSeconds), lengthSeconds, thumbnail:thumb(id)
        });
      }).filter(v=>v.id && (!v.lengthSeconds || v.lengthSeconds > 30) &&
        (wantsNonSong||!/\b(?:reaction|interview|review|behind\s+the\s+scenes|tutorial)\b/i.test(v.title)));
      if(!out.length) throw new Error('No usable results');
      const seenIds=new Set(),seenTracks=new Set();
      const unique=out.filter(track=>{
        const identity=trackIdentity(track);
        if(seenIds.has(track.id)||(identity&&seenTracks.has(identity))) return false;
        seenIds.add(track.id);
        if(identity) seenTracks.add(identity);
        return true;
      });
      return lruSet(searchCache,cacheKey,unique,SEARCH_CACHE_LIMIT);
    }catch(e){
      if(e.name==='AbortError'){
        if(signal?.aborted) throw e;
        continue;
      }
      console.warn('search fail',endpoint.url,e.message);
    }
  }
  throw new Error('Search failed');
}

/* getStreamData — fetches /api/v1/videos/{id}, returns {title,author,audioStreams,recommended,proxy} */
async function getStreamData(videoId, signal, skippedSources=new Set()){
  if(signal?.aborted) throw new DOMException("Aborted", "AbortError");
  for(const source of orderedInstances()){
    if(skippedSources.has(source.base)) continue;
    try{
      const cacheKey=`${source.base}:${videoId}`;
      const cached=cachedStreamData(cacheKey);
      if(cached) return cached;
      const timeout=timeoutSignal(8000,signal);
      let d;
      try{
        const res=await fetch(source.videoUrl(videoId),{headers:{Accept:'application/json'},signal:timeout.signal});
        if(!res.ok) throw new Error('HTTP '+res.status);
        d=await res.json();
      }finally{
        timeout.cleanup();
      }
      if(!d||!Array.isArray(d.adaptiveFormats)) throw new Error(d?.error||'no adaptiveFormats');
      const audioStreams=d.adaptiveFormats.filter(f=>typeof f.type==='string'&&f.type.startsWith('audio'));
      if(!audioStreams.length) throw new Error('No audio streams');
      const result={
        cachedAt:Date.now(),
        title:d.title||'Nezināma dziesma', author:d.author||'', lengthSeconds:d.lengthSeconds||0,
        audioStreams, proxy:source.audioProxy||'', sourceBase:source.base,
        recommended:(d.recommendedVideos||[]).map(r=>cleanTrackMetadata({
          id:r.videoId || r.id, title:r.title||'Nezināma dziesma', author:r.author||'',
          duration:r.duration || fmtDur(r.lengthSeconds), lengthSeconds:r.lengthSeconds||parseDuration(r.duration || ''), thumbnail:thumb(r.videoId || r.id)
        }))
      };
      currentProxy=source.base;
      return lruSet(vidCache,cacheKey,result,VID_CACHE_LIMIT);
    }catch(e){
      if(e.name==='AbortError'){
        if(signal?.aborted) throw e;
        continue;
      }
      console.warn('stream fail',source.base,e.message);
    }
  }
  throw new Error('All instances failed for stream data');
}

/* pickAudioStream — ytify preferredStream logic */
function pickAudioStream(streams){
  for(const itag of PREFERRED_ITAGS){
    const f=streams.find(s=>s.url.includes(`itag=${itag}`));
    if(f) return f;
  }
  return streams[streams.length-1];
}

function orderedAudioStreams(streams){
  const out=[];
  for(const itag of PREFERRED_ITAGS){
    const f=streams.find(s=>s.url && String(s.url).includes(`itag=${itag}`));
    if(f && !out.includes(f)) out.push(f);
  }
  const fallbackOrder = supportsOpus ? [140,139] : [251,250,249];
  for(const itag of fallbackOrder){
    const f=streams.find(s=>s.url && String(s.url).includes(`itag=${itag}`));
    if(f && !out.includes(f)) out.push(f);
  }
  for(const f of streams){
    if(f?.url && !out.includes(f)) out.push(f);
  }
  return out;
}

/* proxyAudioUrl — ytify proxyHandler: only proxy music "- Topic" streams.
   Regular videos use direct googlevideo URL; audioErrorHandler retries with proxy on error. */
function proxyAudioUrl(url, proxy, isTopic){
  if(isTopic && proxy && url.includes('googlevideo.com') && !url.includes('&fallback')){
    try{ const o=new URL(url); return url.replace(o.origin, proxy) }catch{ return url }
  }
  return url;
}

/* Convert direct URL to proxied URL (for audioErrorHandler retry) */
function toProxiedUrl(url, proxy){
  if(proxy && url.includes('googlevideo.com')){
    try{ return url.replace(new URL(url).origin, proxy) }catch{ return url }
  }
  return url;
}

function buildAudioCandidates(streams, proxy, isTopic){
  const candidates=[];
  const seen=new Set();
  const add=(url,label)=>{
    if(!url || seen.has(url)) return;
    seen.add(url);
    candidates.push({url,label});
  };
  for(const stream of orderedAudioStreams(streams)){
    const itag = (()=>{ try{ return new URL(stream.url).searchParams.get('itag') || '' }catch{ return '' } })();
    const direct = proxyAudioUrl(stream.url, proxy, isTopic);
    const proxied = toProxiedUrl(stream.url, proxy);
    if(isTopic){
      add(direct, `topic ${itag}`.trim());
    } else {
      add(direct, `direct ${itag}`.trim());
      add(proxied, `proxy ${itag}`.trim());
    }
  }
  return candidates;
}

function fmtDur(s){
  if(!s||!isFinite(s)) return '';
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=Math.floor(s%60);
  const ss=String(x).padStart(2,'0');
  return h>0?`${h}:${String(m).padStart(2,'0')}:${ss}`:`${m}:${ss}`;
}

function parseDuration(duration){
  const parts=String(duration||'').split(':').map(Number).filter(n=>Number.isFinite(n));
  if(parts.length===3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if(parts.length===2) return parts[0]*60 + parts[1];
  if(parts.length===1) return parts[0] || 0;
  return 0;
}

const GENERIC_MUSIC_CHANNEL=/^(?:worldstar(?:hiphop)?|wshh|lyrical lemonade|trap nation|chill nation|rap nation|wave music|cloudkid|7clouds|proximity|majestic casual|mrsuicidesheep|selected|various artists)$/i;
function cleanMusicMeta(trackOrTitle, authorValue=''){
  const source=typeof trackOrTitle==='object'&&trackOrTitle!==null?trackOrTitle:{title:trackOrTitle,author:authorValue};
  const rawTitle=String(source.title||'').replace(/\s+/g,' ').trim();
  const rawAuthor=String(source.author||authorValue||'').replace(/\s+/g,' ').trim();
  let title=rawTitle;
  const isVevoChannel=/VEVO\s*$/i.test(rawAuthor);
  let author=rawAuthor
    .replace(/\s+-\s+Topic\s*$/i,'')
    .replace(/\s*VEVO\s*$/i,'')
    .trim();
  if(isVevoChannel&&!/\s/.test(author)) author=author.replace(/([a-zāčēģīķļņšūž])([A-ZĀČĒĢĪĶĻŅŠŪŽ])/g,'$1 $2');

  // Remove clearly promotional YouTube labels wherever uploaders place them.
  title=title.replace(/\b(?:official(?:\s+music)?\s+video|music\s+video|official\s+audio|lyrics?\s+video|visuali[sz]er)\b/gi,' ');
  // Remove only clearly promotional YouTube bracket groups. Keep real song
  // qualifiers such as "(feat. Drake)", remixes and live versions intact.
  title=title.replace(/\s*[\[(][^\])]{0,180}(?:official|music\s+video|lyrics?|visuali[sz]er|wshh\s+exclusive|audio\s+only|premiere|\b(?:audio|video|4k|hd|hq)\b)[^\])]{0,180}[\])]\s*/gi,' ');
  title=title.replace(/\s*(?:[-–—|•]\s*)?(?:official(?:\s+music)?\s+(?:video|audio)|music\s+video|official\s+(?:video|audio)|lyrics?(?:\s+video)?|visuali[sz]er|wshh\s+exclusive|audio\s+only|premiere|\b(?:4k|hd|hq)\b)\s*$/gi,' ');
  title=title.replace(/\s*[\[(]\s*[\])]\s*/g,' ');
  title=title.replace(/\s+(?:featuring|ft\.?|feat\.?)\s+([^()[\]]+)$/i,' (feat. $1)');
  title=title.replace(/\s+/g,' ').trim();

  // Common upload format: Artist "Song" (WSHH Exclusive …).
  const quoted=title.match(/^(.{2,80}?)\s+["“”]([^"“”]{1,180})["“”](?:\s|$)/);
  if(quoted){
    author=quoted[1].trim();
    title=quoted[2].trim();
  }else{
    // Spotify-style split for "Artist - Song".
    const pipeSplit=title.match(/^(.{2,90}?)\s*\|\s*(.{1,200})$/);
    const split=pipeSplit||title.match(/^(.{2,90}?)\s+[-–—]\s+(.{1,200})$/);
    if(split){
      const inferredArtist=split[1].trim();
      title=split[2].trim();
      if(pipeSplit||!author||GENERIC_MUSIC_CHANNEL.test(author)||author.toLowerCase().includes(inferredArtist.toLowerCase())) author=inferredArtist;
    }
  }

  title=title
    .replace(/\s*[\[(]\s*[\])]\s*$/,'')
    .replace(/^[\s"“”]+|[\s"“”]+$/g,'')
    .replace(/\s+/g,' ')
    .trim();
  if(GENERIC_MUSIC_CHANNEL.test(author)){
    const split=rawTitle.match(/^(.{2,90}?)\s+[-–—]\s+/);
    if(split) author=split[1].trim();
  }
  if(/^(?:unknown|unknown artist|nezināms)$/i.test(author)) author='Nezināms izpildītājs';
  return {title:title||rawTitle||'Nezināma dziesma',author:author||rawAuthor};
}

function cleanTrackMetadata(track){
  const meta=cleanMusicMeta(track);
  return {...track,title:meta.title,author:meta.author};
}

function trackIdentity(track){
  const clean=value=>String(value||'')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/[^a-z0-9]+/g,' ').trim();
  const meta=cleanMusicMeta(track);
  const title=clean(meta.title),author=clean(meta.author);
  return title&&author?`${author}\u0000${title}`:'';
}

function rememberPlayed(track){
  if(track?.id) state.playedIds.add(track.id);
  const identity=trackIdentity(track);
  if(identity) state.playedTracks.add(identity);
}

function wasPlayed(track){
  const identity=trackIdentity(track);
  return !!track && (state.playedIds.has(track.id) || (identity && state.playedTracks.has(identity)));
}

function freshQueueTracks(tracks,limit=12){
  const ids=new Set(state.queue.map(t=>t?.id).filter(Boolean));
  const identities=new Set(state.queue.map(trackIdentity).filter(Boolean));
  const fresh=[];
  for(const track of tracks||[]){
    const identity=trackIdentity(track);
    if(!track?.id || ids.has(track.id) || wasPlayed(track) || (identity&&identities.has(identity))) continue;
    ids.add(track.id); if(identity) identities.add(identity);
    fresh.push({...track,thumbnail:track.thumbnail||thumb(track.id,'default')});
    if(fresh.length>=limit) break;
  }
  return fresh;
}

function appendFreshQueueTracks(tracks,limit=12){
  const fresh=freshQueueTracks(tracks,limit);
  if(!fresh.length) return fresh;
  state.queue.push(...fresh);
  window.__lacitisMiniAppend?.(fresh);
  prefetchNext();
  return fresh;
}

const SEED_REQUEST_LIMIT = LOW_POWER_DEVICE ? 3 : 4;
const seedQueue = [];

function drainSeedQueue(){
  while(seedRequestsActive < SEED_REQUEST_LIMIT && seedQueue.length){
    const job=seedQueue.shift();
    seedRequestsActive++;
    invidiousSearch(job.query)
      .then(job.resolve,job.reject)
      .finally(()=>{ seedRequestsActive--; drainSeedQueue(); });
  }
}

function queuedSeedSearch(query){
  return new Promise((resolve,reject)=>{
    seedQueue.push({query,resolve,reject});
    drainSeedQueue();
  });
}

async function fetchSeedTracks(queries, maxItems){
  const results = [];
  const candidates=queries.slice(0,Math.min(queries.length,maxItems+2));
  const settled=await Promise.allSettled(candidates.map(queuedSeedSearch));
  for(const r of settled){
    if(r.status==='fulfilled' && r.value[0]){
      const trk=r.value[0];
      if(!results.find(x=>x.id===trk.id)) results.push(trk);
      if(results.length>=maxItems) break;
    }
  }
  return results;
}

let rrStations = [];        // cached station list
let rrCache = null;         // full API response cache
let rrFetchPromise = null;  // collapse duplicate catalogue requests
let isRadioMode = false;    // true when playing a radio station
let currentStation = null;  // active station object
let currentRadioStations = [];

async function fetchRadioStations(){
  if(rrCache) return rrStations;
  let staleStations = [];
  // Use a fresh catalogue immediately; keep an older one as an offline fallback.
  try{
    const rc=JSON.parse(localStorage.getItem('rr-stations-cache'));
    if(rc?.stations?.length){
      staleStations=rc.stations;
      if(Date.now()-rc.ts<21600000){
        rrStations=staleStations;rrCache=true;return rrStations;
      }
    }
  }catch(e){}
  if(rrFetchPromise) return rrFetchPromise;
  rrFetchPromise=(async()=>{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),6000);
    try{
      const res = await fetch(RR_API, {headers:{Accept:'application/json'},signal:controller.signal});
      if(!res.ok) throw new Error('RadioRecord API HTTP '+res.status);
      const data = await res.json();
      const stations = (data.result?.stations||[]).map(s=>({
        id: 'rr-'+s.id,
        prefix: s.prefix,
        title: s.title,
        tooltip: s.tooltip || '',
        cover: s.bg_image_mobile || s.bg_image || '',
        stream128: s.stream_128 || s.stream_64,
        stream320: s.stream_320,
        streamHls: s.stream_hls,
        isRadio: true
      })).filter(s=>s.stream128);
      if(!stations.length) throw new Error('RadioRecord returned no stations');
      rrCache = data;
      rrStations = stations;
      try{localStorage.setItem('rr-stations-cache',JSON.stringify({ts:Date.now(),stations}))}catch(e){}
      return rrStations;
    }catch(error){
      if(staleStations.length){
        rrStations=staleStations;
        rrCache='stale';
        return rrStations;
      }
      throw error;
    }finally{
      clearTimeout(timeout);
    }
  })();
  try{return await rrFetchPromise}finally{rrFetchPromise=null}
}

function radioStreamCandidates(station){
  const nativeHls=Boolean(radioAudio.canPlayType('application/vnd.apple.mpegurl'));
  return [...new Set([station.stream320,station.stream128,station.streamHls].filter(Boolean))]
    .filter(url=>String(url).startsWith('https://'))
    .filter(url=>!String(url).includes('.m3u8') || nativeHls);
}

function pickRadioStream(station){
  return radioStreamCandidates(station)[0] || '';
}

function isRadioAvailable(station){
  return radioStreamCandidates(station).length>0;
}

let cancelPendingRadioLoad=null;
function loadRadioUrl(url,requestId){
  cancelPendingRadioLoad?.();
  return new Promise((resolve,reject)=>{
    let settled=false;
    const finish=error=>{
      if(settled) return;
      settled=true;
      clearTimeout(timer);
      radioAudio.removeEventListener('playing',onPlaying);
      radioAudio.removeEventListener('error',onError);
      cancelPendingRadioLoad=null;
      if(error) reject(error); else resolve();
    };
    const onPlaying=()=>requestId===playRequestId ? finish() : finish(playbackAbortError());
    const onError=()=>finish(new Error('Radio stream failed'));
    const timer=setTimeout(()=>finish(new Error('Radio stream timeout')),10000);
    cancelPendingRadioLoad=()=>finish(playbackAbortError());
    radioAudio.addEventListener('playing',onPlaying,{once:true});
    radioAudio.addEventListener('error',onError,{once:true});
    radioAudio.src=url;
    radioAudio.play().then(onPlaying).catch(finish);
  });
}

/* Play a radio station — live stream, no progress bar (LIVE mode) */
async function playRadioStation(station,stationList=currentRadioStations){
  const requestId=++playRequestId;
  playAbortController?.abort();
  playAbortController=null;
  cancelPendingAudioLoad?.();
  cancelPendingRadioLoad?.();
  audio.pause();
  isRadioMode = true;
  currentStation = station;
  if(stationList?.length) currentRadioStations=[...stationList];
  state.current = {            // fake a "current track" so UI updates
    id: station.id,
    title: station.title,
    author: station.tooltip || 'Radio Record',
    thumbnail: station.cover,
    lengthSeconds: 0,          // 0 = live/unknown duration
    isRadio: true
  };
  state.isLoading = true;
  updateNowPlaying();
  setPlayBtnLoading(true);
  $('#np-track').textContent = station.title;
  $('#np-artist').textContent = station.tooltip || 'Radio Record';
  $('#np-cover').src = station.cover;
  try{
    const candidates=radioStreamCandidates(station);
    if(!candidates.length) throw new Error('No secure radio stream');
    let lastError=null;
    for(const url of candidates){
      try{
        await loadRadioUrl(url,requestId);
        lastError=null;
        break;
      }catch(error){
        if(error?.name==='AbortError' || requestId!==playRequestId) return;
        lastError=error;
      }
    }
    if(lastError) throw lastError;
    if(requestId!==playRequestId) return;
    setPlayBtnLoading(false);
    state.isLoading = false;
    clearToast();
    refreshRadioStates();
  }catch(e){
    if(e?.name==='AbortError' || requestId!==playRequestId) return;
    console.error('radio play error',e);
    radioAudio.removeAttribute('src');
    radioAudio.load();
    setPlayBtnLoading(false);
    state.isLoading = false;
    $('#time-current').textContent='OFFLINE';
    $('#time-total').textContent='';
    toast(e.message==='No secure radio stream' ? 'Šai stacijai nav droša HTTPS avota' : 'Stacija pašlaik nav pieejama',true);
  }
}

function refreshRadioStates(){
  $$('.radio-card').forEach(c=>{
    c.classList.toggle('active', currentStation && c.dataset.id===currentStation.id);
    const eq = c.querySelector('.radio-eq');
    if(eq) eq.classList.toggle('playing', currentStation && c.dataset.id===currentStation.id && state.isPlaying);
  });
}

/* Render the Radio view — station grid + genre filter chips */
function renderRadioView(stations){
  // Only render the grid + genre chips, DON'T touch #main-content (preserves the tab bar)
  // Find or create the grid container
  let grid = $('#radio-grid');
  if(!grid) return;

  // Render genre filter chips (separate from tabs)
  let chipsWrap = $('#radio-genres');
  if(!chipsWrap){
    const section = grid.closest('.section');
    chipsWrap = document.createElement('div');
    chipsWrap.className = 'radio-chips';
    chipsWrap.id = 'radio-genres';
    section.insertBefore(chipsWrap, section.firstChild);
  }

  // Genre chips depend on the station set
  const isLV = stations.length > 0 && stations[0].id && stations[0].id.startsWith('rr-lv-');
  const genres = isLV
    ? ['All','LR','EHR','SWH','Skonto','Relax']
    : ['All','Deep','Chill','Rock','Dance','Russian','90s','Festivals'];

  chipsWrap.innerHTML = '';
  genres.forEach((g,i)=>{
    const chip = document.createElement('button');
    chip.className = 'radio-chip'+(i===0?' active':'');
    chip.textContent = ({All:'Visi',Russian:'Krievu',Festivals:'Festivāli'}[g]||g);
    chip.addEventListener('click',()=>{
      $('#radio-genres').querySelectorAll('.radio-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      const filtered = g==='All' ? stations : stations.filter(s=>
        (s.title+' '+s.tooltip+' '+(s.prefix||'')).toLowerCase().includes(g.toLowerCase()));
      renderRadioCards('#radio-grid', filtered);
    });
    chipsWrap.appendChild(chip);
  });

  // Update count text
  const availableCount=stations.filter(isRadioAvailable).length;
  const unavailableCount=stations.length-availableCount;
  const countEl = $('#radio-count');
  if(countEl) countEl.textContent = availableCount+' pieejamas'+(unavailableCount?' · '+unavailableCount+' bez HTTPS':'');

  renderRadioCards('#radio-grid', stations);
}

function renderRadioCards(target, stations){
  const g = $(target); g.innerHTML='';
  stations.forEach(s=>{
    const available=isRadioAvailable(s);
    const c = document.createElement('div');
    c.className = 'card radio-card'+(available?'':' unavailable'); c.dataset.id = s.id;
    c.setAttribute('role','button');
    c.setAttribute('aria-disabled',available?'false':'true');
    c.setAttribute('aria-label',available?'Atskaņot '+s.title:s.title+' nav pieejams');
    if(available) c.tabIndex=0;
    c.innerHTML = `
      <div class="radio-cover-wrap">
        <img class="card-cover" src="${esc(s.cover)}" alt="" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='icons/radio-default.svg'">
        <div class="radio-eq"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="card-title">${esc(s.title)}</div>
      <div class="card-desc">${esc(s.tooltip)}</div>
      ${available?'':'<span class="radio-status">Nav HTTPS avota</span>'}
      <span class="card-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>`;
    if(available){
      c.addEventListener('click',()=>playRadioStation(s,stations));
      c.addEventListener('keydown',event=>{
        if(event.key==='Enter'||event.key===' '){event.preventDefault();playRadioStation(s,stations)}
      });
    }
    g.appendChild(c);
  });
  refreshRadioStates();
}

function renderRadioError(message){
  const grid=$('#radio-grid');
  if(!grid) return;
  grid.innerHTML=`<div class="radio-empty"><div><strong>Radio Record pašlaik nav sasniedzams</strong><span>${esc(message)}</span></div><button type="button" id="radio-retry">Mēģināt vēlreiz</button></div>`;
  $('#radio-retry')?.addEventListener('click',()=>document.querySelector('[data-group="rr"]')?.click());
  const countEl=$('#radio-count');
  if(countEl) countEl.textContent='Latvijas radio joprojām ir pieejams';
}

const HOME_CACHE_KEY='lac-home-cache-v1';
const HOME_CACHE_TTL=21600000; // 6h — after this we still show cache, just refresh silently

function renderHome(top,made,rot){
  state.topTracks=top;state.madeFor=made;state.rotation=rot;
  renderCards('#top-grid',top,t=>t.author);
  renderCards('#made-grid',made,t=>t.author);
  renderList('#rotation-list',rot);
  state.queue=[...top];state.qIndex=0;
  renderLibrary();
}

function readHomeCache(){
  try{
    const c=JSON.parse(localStorage.getItem(HOME_CACHE_KEY));
    if(c&&Array.isArray(c.top)&&c.top.length) return c;
  }catch(e){}
  return null;
}

async function loadHome(){
  // 1. Instant paint from cache if we have one — no network wait on start.
  const cache=readHomeCache();
  let hadCache=false;
  if(cache){
    renderHome(cache.top,cache.made||[],cache.rot||[]);
    hadCache=true;
    // Fresh enough? Skip the network refresh entirely.
    if(Date.now()-(cache.ts||0)<HOME_CACHE_TTL) return;
  }else{
    renderSkeletonCards('#top-grid',8);
    renderSkeletonCards('#made-grid',5);
    renderSkeletonList('#rotation-list',8);
  }
  // 2. Refresh in the background (silent if we already painted from cache).
  try{
    const [top,made,rot]=await Promise.all([
      fetchSeedTracks(SEED_QUERIES,10),
      fetchSeedTracks(MADE_QUERIES,5),
      fetchSeedTracks(ROTATION_QUERIES,10)
    ]);
    if(top.length){
      renderHome(top,made,rot);
      try{localStorage.setItem(HOME_CACHE_KEY,JSON.stringify({ts:Date.now(),top,made,rot}))}catch(e){}
    }
  }catch(e){
    if(!hadCache) toast('Neizdevās ielādēt mūziku — pārbaudi savienojumu',true);
    console.error(e);
  }
}

   PLAYBACK — real audio streams for songs, native audio for radio
   ════════════════════════════════════════════════════════════════ */
const audio=$('#audio');
const radioAudio=$('#radio-audio');
const activeAudio=()=>isRadioMode?radioAudio:audio;
const SOUND_PROFILE_KEY='lacitis:sound-profile:v1';
const SOUND_PROFILES={
  off:{hp:20,lowHz:150,low:0,voiceHz:2600,voice:0,airHz:8000,air:0,width:0,threshold:0,knee:0,ratio:1,attack:.003,release:.25,master:1},
  surround:{hp:38,lowHz:150,low:1.8,voiceHz:2600,voice:1.4,airHz:8000,air:1.2,width:.18,threshold:-18,knee:18,ratio:1.65,attack:.01,release:.23,master:.96},
  speakers:{hp:55,lowHz:160,low:3.2,voiceHz:2400,voice:2.2,airHz:7600,air:1,width:.04,threshold:-24,knee:20,ratio:2.3,attack:.008,release:.25,master:.88},
  night:{hp:55,lowHz:150,low:-1,voiceHz:2200,voice:1,airHz:7000,air:-1.5,width:.02,threshold:-28,knee:24,ratio:3.2,attack:.006,release:.3,master:.76}
};
let soundProfile=(()=>{
  try{ const saved=localStorage.getItem(SOUND_PROFILE_KEY); return SOUND_PROFILES[saved]?saved:'off'; }
  catch(e){ return 'off'; }
})();
let soundGraph=null;
let soundGraphError='';

function ensureSoundGraph(){
  if(soundGraph) return soundGraph;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass) throw new Error('Web Audio nav pieejams šajā pārlūkā.');
  try{
    const context=new AudioContextClass({latencyHint:'playback'});
    const source=context.createMediaElementSource(audio);
    const highPass=context.createBiquadFilter(); highPass.type='highpass'; highPass.Q.value=.7;
    const lowShelf=context.createBiquadFilter(); lowShelf.type='lowshelf';
    const voice=context.createBiquadFilter(); voice.type='peaking'; voice.Q.value=.8;
    const air=context.createBiquadFilter(); air.type='highshelf';
    const splitter=context.createChannelSplitter(2);
    const leftMain=context.createGain(),leftCross=context.createGain();
    const rightMain=context.createGain(),rightCross=context.createGain();
    const merger=context.createChannelMerger(2);
    const compressor=context.createDynamicsCompressor();
    const master=context.createGain();
    source.connect(highPass); highPass.connect(lowShelf); lowShelf.connect(voice); voice.connect(air); air.connect(splitter);
    splitter.connect(leftMain,0); splitter.connect(leftCross,0);
    splitter.connect(rightMain,1); splitter.connect(rightCross,1);
    leftMain.connect(merger,0,0); leftCross.connect(merger,0,1);
    rightMain.connect(merger,0,1); rightCross.connect(merger,0,0);
    merger.connect(compressor); compressor.connect(master); master.connect(context.destination);
    soundGraph={context,source,highPass,lowShelf,voice,air,leftMain,leftCross,rightMain,rightCross,compressor,master};
    soundGraphError='';
    applySoundProfile(soundProfile,true);
    return soundGraph;
  }catch(error){
    soundGraphError=String(error?.message||error||'Skaņas apstrāde nav pieejama.');
    throw error;
  }
}

function setAudioParam(param,value,instant=false){
  const context=soundGraph?.context; if(!context||!param) return;
  const now=context.currentTime;
  param.cancelScheduledValues(now);
  if(instant) param.setValueAtTime(value,now);
  else param.setTargetAtTime(value,now,.035);
}

function applySoundProfile(name=soundProfile,instant=false){
  if(!soundGraph) return;
  const profile=SOUND_PROFILES[name]||SOUND_PROFILES.off;
  setAudioParam(soundGraph.highPass.frequency,profile.hp,instant);
  setAudioParam(soundGraph.lowShelf.frequency,profile.lowHz,instant);
  setAudioParam(soundGraph.lowShelf.gain,profile.low,instant);
  setAudioParam(soundGraph.voice.frequency,profile.voiceHz,instant);
  setAudioParam(soundGraph.voice.gain,profile.voice,instant);
  setAudioParam(soundGraph.air.frequency,profile.airHz,instant);
  setAudioParam(soundGraph.air.gain,profile.air,instant);
  setAudioParam(soundGraph.leftMain.gain,1+profile.width,instant);
  setAudioParam(soundGraph.rightMain.gain,1+profile.width,instant);
  setAudioParam(soundGraph.leftCross.gain,-profile.width,instant);
  setAudioParam(soundGraph.rightCross.gain,-profile.width,instant);
  setAudioParam(soundGraph.compressor.threshold,profile.threshold,instant);
  setAudioParam(soundGraph.compressor.knee,profile.knee,instant);
  setAudioParam(soundGraph.compressor.ratio,profile.ratio,instant);
  setAudioParam(soundGraph.compressor.attack,profile.attack,instant);
  setAudioParam(soundGraph.compressor.release,profile.release,instant);
  setAudioParam(soundGraph.master.gain,profile.master,instant);
}

function activateSoundProfile(){
  if(soundProfile==='off'&&!soundGraph) return;
  try{
    const graph=ensureSoundGraph();
    applySoundProfile(soundProfile);
    if(graph.context.state==='suspended'){
      graph.context.resume()
        .then(()=>{
          window.__lacitisSoundChanged?.(soundStatus());
          window.__lacitisFullSoundChanged?.(soundStatus());
        })
        .catch(()=>{
          window.__lacitisSoundChanged?.(soundStatus());
          window.__lacitisFullSoundChanged?.(soundStatus());
        });
    }else{
      window.__lacitisSoundChanged?.(soundStatus());
      window.__lacitisFullSoundChanged?.(soundStatus());
    }
  }catch(e){}
}

function setSoundProfile(name){
  if(!SOUND_PROFILES[name]) name='off';
  soundProfile=name;
  try{ localStorage.setItem(SOUND_PROFILE_KEY,name); }catch(e){}
  document.documentElement.dataset.soundProfile=name;
  if(name!=='off'||soundGraph) activateSoundProfile();
  window.__lacitisSoundChanged?.(soundStatus());
  window.__lacitisFullSoundChanged?.(soundStatus());
  return soundStatus();
}

function soundStatus(){
  const profile=SOUND_PROFILES[soundProfile]||SOUND_PROFILES.off;
  const contextState=soundGraph?.context?.state||'not-created';
  return {
    profile:soundProfile,
    supported:!!(window.AudioContext||window.webkitAudioContext),
    active:!!soundGraph&&soundProfile!=='off'&&contextState==='running',
    contextState,
    processing:!!soundGraph&&soundProfile!=='off',
    width:profile.width,
    lowGain:profile.low,
    voiceGain:profile.voice,
    airGain:profile.air,
    masterGain:profile.master,
    error:soundGraphError
  };
}
document.documentElement.dataset.soundProfile=soundProfile;
let playRequestId=0;
let playAbortController=null;
let cancelPendingAudioLoad=null;

/* prefetchNext — ytify-style preloading: warm the next track's stream data
   into vidCache while the current track plays, so skip / auto-advance is instant. */
let _prefetchedId = null;
let consecutivePlaybackFailures = 0;
function prefetchNext(){
  if(isRadioMode || MINI_EMBED || LOW_POWER_DEVICE || document.visibilityState==='hidden') return;
  try{
    const next = state.queue[state.qIndex + 1];
    if(!next || !next.id || next.id === _prefetchedId) return;
    _prefetchedId = next.id;
    // Fire-and-forget: getStreamData caches by source, so the real play hits cache.
    getStreamData(next.id).catch(()=>{ if(_prefetchedId===next.id) _prefetchedId=null; });
  }catch(e){}
}

async function playTrack(track, contextList, isAutomaticRecovery=false){
  if(!isAutomaticRecovery) consecutivePlaybackFailures=0;
  activateSoundProfile();
  const requestId=++playRequestId;
  playAbortController?.abort();
  playAbortController=new AbortController();
  cancelPendingAudioLoad?.();
  cancelPendingRadioLoad?.();
  radioAudio.pause();
  isRadioMode = false; currentStation = null; $('.player').classList.remove('live');
  if(state.current && state.current.id===track.id && !state.isLoading && audio.getAttribute('src') && !audio.error){ togglePlay(); return; }
  // Set queue from context list
  if(contextList){
    const idx=contextList.findIndex(t=>t.id===track.id);
    if(idx>=0){ state.queue=[...contextList]; state.qIndex=idx; }
  }
  state.current=track; state.position=0; state.isLoading=true;
  state.streamTriedBases = new Set();
  updateNowPlaying(); setPlayBtnLoading(true); refreshListStates();
  $('#np-track').textContent='Ielādē…';
  try{
    const data=await getStreamData(track.id,playAbortController.signal);
    if(requestId!==playRequestId) return;
    state.streamTriedBases.add(data.sourceBase);
    const isTopic = (data.author || track.author || '').endsWith('- Topic');
    const candidates = buildAudioCandidates(data.audioStreams, data.proxy, isTopic);
    if(!candidates.length) throw new Error('No playable audio format');
    state.audioCandidates = candidates;
    state.audioCandidateIndex = 0;
    state.retryingAudio = false;
    // Store clean Spotify-style metadata instead of YouTube promo labels.
    const cleanMeta=cleanMusicMeta({title:data.title,author:data.author});
    track.title=cleanMeta.title; track.author=cleanMeta.author;
    track.lengthSeconds=data.lengthSeconds; track.duration=fmtDur(data.lengthSeconds);
    updateNowPlaying();
    addToHistory(track);  // record in history + sync
    try{
      await loadAudio(candidates[0].url,requestId);
      clearToast();
    }catch(firstAudioError){
      if(requestId!==playRequestId || firstAudioError?.name==='AbortError') return;
      if(isPlaybackGestureBlocked(firstAudioError)) throw firstAudioError;
      const recovered = await tryNextAudioCandidate();
      if(requestId!==playRequestId) return;
      if(!recovered){
        const sourceRecovered = await tryNextStreamSource(track);
        if(!sourceRecovered) throw firstAudioError;
      }
    }
    if(requestId!==playRequestId) return;
    setPlayBtnLoading(false);
    state.isLoading=false;
    consecutivePlaybackFailures=0;
    rememberPlayed(track);
    // Auto-queue recommended videos when queue runs low (ytify radio)
    if(state.qIndex>=state.queue.length-1 && data.recommended.length){
      appendFreshQueueTracks(data.recommended,12);
    }
    refreshListStates();
    prefetchNext();
  }catch(e){
    if(requestId!==playRequestId || e?.name==='AbortError') return;
    console.error('playTrack error',e);
    state.audioCandidates = [];
    state.audioCandidateIndex = -1;
    state.retryingAudio = false;
    state.streamTriedBases = new Set();
    setPlayBtnLoading(false); state.isLoading=false;
    if(isPlaybackGestureBlocked(e)){
      updateNowPlaying();
      toast('Nospied Play, lai sāktu atskaņošanu',true);
      return;
    }
    invalidateStreamData(track.id);
    consecutivePlaybackFailures++;
    if(autoSkip()) toast('Nevar atskaņot — mēģina nākamo dziesmu',true);
    else toast("Straume pašlaik nav pieejama",true);
  }
}

function isPlaybackGestureBlocked(error){
  const message=String(error?.message||error||'');
  return error?.name==='NotAllowedError' || message.includes("didn't interact") || message.includes('user gesture');
}

function playbackAbortError(){
  const error=new Error('Playback superseded');
  error.name='AbortError';
  return error;
}

function loadAudio(url,requestId=playRequestId){
  cancelPendingAudioLoad?.();
  return new Promise((resolve,reject)=>{
    let settled=false;
    let timeoutId=0;
    const cleanup=()=>{
      clearTimeout(timeoutId);
      audio.removeEventListener('canplay',onC);
      audio.removeEventListener('error',onE);
      if(cancelPendingAudioLoad===cancel) cancelPendingAudioLoad=null;
    };
    const fail=(error)=>{ if(settled)return; settled=true; cleanup(); reject(error); };
    const cancel=()=>fail(playbackAbortError());
    const onC=()=>{
      if(settled)return;
      if(requestId!==playRequestId){ cancel(); return; }
      settled=true;
      cleanup();
      audio.play().then(resolve).catch(reject);
    };
    const onE=()=>fail(new Error('audio load error'));
    cancelPendingAudioLoad=cancel;
    audio.addEventListener('canplay',onC);
    audio.addEventListener('error',onE);
    timeoutId=setTimeout(()=>fail(new Error('audio load timeout')),12000);
    audio.src=url;
    audio.load();
  });
}

async function tryNextAudioCandidate(){
  const requestId=playRequestId;
  if(isRadioMode || !state.audioCandidates.length || state.retryingAudio) return false;
  const nextIndex = state.audioCandidateIndex + 1;
  if(nextIndex >= state.audioCandidates.length) return false;
  const next = state.audioCandidates[nextIndex];
  state.retryingAudio = true;
  state.audioCandidateIndex = nextIndex;
  state.isLoading = true;
  setPlayBtnLoading(true);
  try{
    console.warn('Audio error, retrying stream candidate:', next.label || nextIndex);
    await loadAudio(next.url,requestId);
    if(requestId!==playRequestId) return false;
    clearToast();
    state.isLoading = false;
    state.retryingAudio = false;
    setPlayBtnLoading(false);
    return true;
  }catch(e){
    if(requestId!==playRequestId || e?.name==='AbortError') return false;
    if(isPlaybackGestureBlocked(e)){
      throw e;
    }
    state.isLoading = false;
    state.retryingAudio = false;
    setPlayBtnLoading(false);
    return tryNextAudioCandidate();
  }
}

async function tryNextStreamSource(track){
  const requestId=playRequestId;
  if(isRadioMode || !track?.id || state.retryingAudio) return false;
  while(state.streamTriedBases.size < YTIFY_STREAM_BACKENDS.length){
    let data;
    try{
      data = await getStreamData(track.id, playAbortController?.signal, state.streamTriedBases);
    }catch(e){
      console.warn('No more stream backends for track',track.id,e.message);
      return false;
    }
    if(requestId!==playRequestId) return false;
    if(!data?.sourceBase || state.streamTriedBases.has(data.sourceBase)) return false;
    state.streamTriedBases.add(data.sourceBase);
    const isTopic = (data.author || track.author || '').endsWith('- Topic');
    const candidates = buildAudioCandidates(data.audioStreams, data.proxy, isTopic);
    if(!candidates.length) continue;
    state.audioCandidates = candidates;
    state.audioCandidateIndex = 0;
    state.retryingAudio = false;
    state.isLoading = true;
    setPlayBtnLoading(true);
    track.title=data.title; track.author=data.author;
    track.lengthSeconds=data.lengthSeconds; track.duration=fmtDur(data.lengthSeconds);
    updateNowPlaying();
    try{
      console.warn('Retrying with next stream backend:', data.sourceBase);
      await loadAudio(candidates[0].url,requestId);
      if(requestId!==playRequestId) return false;
      clearToast();
      state.isLoading = false;
      setPlayBtnLoading(false);
      return true;
    }catch(e){
      if(requestId!==playRequestId || e?.name==='AbortError') return false;
      if(isPlaybackGestureBlocked(e)) throw e;
      const recovered = await tryNextAudioCandidate();
      if(recovered) return true;
    }
  }
  return false;
}

function refreshListStates(){

    r.classList.toggle('playing',playing);

  });
  $$('.card').forEach(c=>c.classList.toggle('active',state.current && c.dataset.id===state.current.id));
}

function nextTrack(skipPlayed=false){
  if(isRadioMode && currentRadioStations.length){
    const idx = currentRadioStations.findIndex(s=>s.id===(currentStation?.id));
    const next = currentRadioStations[(Math.max(idx,0)+1)%currentRadioStations.length];
    playRadioStation(next,currentRadioStations); return true;
  }
  if(!state.queue.length) return false;
  let i=state.qIndex;
  if(state.shuffle){
    const choices=state.queue.map((track,index)=>({track,index}))
      .filter(item=>!skipPlayed||!wasPlayed(item.track));
    if(!choices.length) return false;
    i=choices[Math.floor(Math.random()*choices.length)].index;
  }
  else{
    i++;
    if(skipPlayed && state.repeat!=='all'){
      while(i<state.queue.length && wasPlayed(state.queue[i])) i++;
    }
    if(i>=state.queue.length){ if(state.repeat==='all') i=0; else return false }
  }
  state.qIndex=i; playTrack(state.queue[i],state.queue);
  return true;
}
function prevTrack(){
  if(isRadioMode && currentRadioStations.length){
    const idx = currentRadioStations.findIndex(s=>s.id===(currentStation?.id));
    const prevIndex=idx<0?currentRadioStations.length-1:(idx-1+currentRadioStations.length)%currentRadioStations.length;
    playRadioStation(currentRadioStations[prevIndex],currentRadioStations); return;
  }
  if(state.position>3){
    state.position=0;
    audio.currentTime=0;
    updateProgress();
    return;
  }
  if(!state.queue.length) return;
  let i=state.qIndex-1; if(i<0) i=state.repeat==='all'?state.queue.length-1:0;
  state.qIndex=i; playTrack(state.queue[i],state.queue);
}
function autoSkip(){
  if(consecutivePlaybackFailures>=2 || state.qIndex>=state.queue.length-1) return false;
  state.qIndex++;
  playTrack(state.queue[state.qIndex],state.queue,true);
  return true;
}

let endRefillPromise=null;
function continueAfterEnd(){
  if(nextTrack(true)) return Promise.resolve(true);
  if(endRefillPromise) return endRefillPromise;

  const endedTrack=state.current;
  const endedId=endedTrack?.id;
  const requestAtEnd=playRequestId;
  if(!endedId) return Promise.resolve(false);

  state.isLoading=true;
  setPlayBtnLoading(true);

  endRefillPromise=(async()=>{
    let added=[];

    // First use YouTube's recommendations for the track that just ended.
    try{
      const data=await getStreamData(endedId);
      if(playRequestId!==requestAtEnd || state.current?.id!==endedId) return false;
      added=appendFreshQueueTracks(data.recommended,12);
    }catch(e){
      console.warn('end-of-queue recommendations failed',e);
    }

    // Some Invidious instances return no recommendations. Search provides a
    // separate continuation source so reaching the last result never stops.
    if(!added.length){
      const artist=String(endedTrack.author||'').replace(/\s+-\s+Topic$/,'').trim();
      const queries=[
        `${artist} songs`,
        `${endedTrack.title||''} ${artist} music`,
        `${artist||'popular'} similar music`
      ].filter(q=>q.trim().length>5);
      const results=await Promise.allSettled(queries.map(q=>invidiousSearch(q)));
      if(playRequestId!==requestAtEnd || state.current?.id!==endedId) return false;
      const candidates=results.flatMap(result=>result.status==='fulfilled'?result.value:[]);
      added=appendFreshQueueTracks(candidates,12);
    }

    if(playRequestId!==requestAtEnd || state.current?.id!==endedId) return false;
    if(!added.length) throw new Error('No new tracks were returned');

    state.isLoading=false;
    return nextTrack(true);
  })().catch(error=>{
    if(playRequestId===requestAtEnd && state.current?.id===endedId){
      console.error('end-of-queue refill failed',error);
      toast('Neizdevās ielādēt nākamās dziesmas — mēģini vēlreiz',true);
    }
    return false;
  }).finally(()=>{
    if(playRequestId===requestAtEnd && state.current?.id===endedId){
      state.isLoading=false;
      setPlayBtnLoading(false);
      updateNowPlaying();
    }
    endRefillPromise=null;
  });

  return endRefillPromise;
}

/* ════════════════════════════════════════════════════════════════
   AUDIO EVENTS
   ════════════════════════════════════════════════════════════════ */
audio.addEventListener('play',()=>{ if(!isRadioMode) setPlayingUI(true); });
audio.addEventListener('pause',()=>{ if(!isRadioMode) setPlayingUI(false); });
radioAudio.addEventListener('play',()=>{ if(isRadioMode){ setPlayingUI(true); $('.player').classList.add('live'); refreshRadioStates(); } });
radioAudio.addEventListener('pause',()=>{ if(isRadioMode){ setPlayingUI(false); refreshRadioStates(); } });
audio.addEventListener('timeupdate',()=>{
  state.position=audio.currentTime; updateProgress();
});
audio.addEventListener('loadedmetadata',()=>{
  if(!isRadioMode && state.current && !state.current.lengthSeconds && Number.isFinite(audio.duration)){
    state.current.lengthSeconds=audio.duration; state.current.duration=fmtDur(audio.duration);
    $('#time-total').textContent=fmt(audio.duration);
  }
});
audio.addEventListener('ended',()=>{
  if(isRadioMode){ return; }  // live streams don't end
  if(state.repeat==='one'){ audio.currentTime=0; audio.play(); return }
  continueAfterEnd();
});
audio.addEventListener('error',async ()=>{
  if(!audio.src || state.isLoading || isRadioMode) return;
  const failedRequest=playRequestId;
  const failedTrack=state.current;
  if(failedTrack) invalidateStreamData(failedTrack.id);
  let recovered = false;
  try{
    recovered = await tryNextAudioCandidate();
    if(failedRequest!==playRequestId) return;
  }catch(e){
    if(isPlaybackGestureBlocked(e)){
      toast('Nospied Play, lai sāktu atskaņošanu',true);
      return;
    }
    console.warn('audio recovery failed',e);
  }
  if(failedRequest!==playRequestId || recovered) return;
  try{
    recovered = await tryNextStreamSource(failedTrack);
  }catch(e){
    if(isPlaybackGestureBlocked(e)){
      toast('Nospied Play, lai sāktu atskaņošanu',true);
      return;
    }
    console.warn('stream backend recovery failed',e);
  }
  if(failedRequest!==playRequestId || recovered) return;
  consecutivePlaybackFailures++;
  if(autoSkip()) toast('Straumes kļūda — mēģina nākamo dziesmu',true);
  else toast('Straume pašlaik nav pieejama',true);
});

    if(searchInput.value.trim()!==q) return;

}

let radioViewRequestId=0;
async function loadRadioView(){
  setSectionActive('radio');
  const initialRequestId=++radioViewRequestId;
  const mc=$('#main-content');
  mc.innerHTML = `
    <div class="section" style="margin-top:8px">
      <h1 class="section-title">Radio</h1>
      <p style="color:var(--text-sub);margin-top:4px"><span id="radio-count">…</span> — izvēlies grupu</p>
    </div>

    <div class="radio-header">
      <div class="radio-chips" id="radio-tabs">
        <button class="radio-chip active" data-group="rr">Radio Record</button>
        <button class="radio-chip" data-group="lv">Latviešu Radio</button>
      </div>
      <div class="view-toggle" id="radio-view-toggle">
        <button id="view-grid" class="active" title="Režģis" aria-label="Režģa skats"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zm0 9h7v7h-7zM4 13h7v7H4z"/></svg></button>
        <button id="view-list" title="Saraksts" aria-label="Saraksta skats"><svg viewBox="0 0 24 24"><path d="M4 6h2v2H4zm0 5h2v2H4zm0 5h2v2H4zM8 6h13v2H8zm0 5h13v2H8zm0 5h13v2H8z"/></svg></button>
      </div>
    </div>
    <div class="section">
      <div class="card-grid" id="radio-grid"></div>
    </div>`;

  // Tab switching
  $$('#radio-tabs .radio-chip').forEach(tab => {
    tab.addEventListener('click', async () => {
      const requestId=++radioViewRequestId;
      $$('#radio-tabs .radio-chip').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      // Remove old genre chips when switching
      const oldGenres = $('#radio-genres');
      if(oldGenres) oldGenres.remove();
      const group = tab.dataset.group;
      if(group === 'rr'){
        renderSkeletonCards('#radio-grid',12);
        try{
          const stations = await fetchRadioStations();
          if(requestId!==radioViewRequestId) return;
          renderRadioView(stations);
        }catch(e){
          if(requestId!==radioViewRequestId) return;
          renderRadioError('Pārbaudi savienojumu vai izmanto “Latviešu Radio”.');
        }
      } else {
        renderRadioView(LV_RADIO_STATIONS);
      }
    });
  });

  // View toggle (grid/list) — restore saved preference
  const savedView = localStorage.getItem("radio-view") || "grid";
  const grid = $("#radio-grid");
  const vg = $("#view-grid"), vl = $("#view-list");
  function setView(v){
    if(v==="list"){ grid.classList.add("list-view"); vg.classList.remove("active"); vl.classList.add("active"); }
